<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 14.6s" />
    <meta name="poster" content="11.9" />
    <title>Lead reactivation</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script>
      // Lead reactivation, as a story (services.ts). Act 1: a wall of old leads
      // nobody has written to in months, gathering dust. Act 2: with Neurokov
      // they hear from the owner again, and replies come back. Act 3: the ones who replied land on the calendar as booked calls.
      // One set, a gentle camera, no numbers: there is no case study behind it.
      //
      // Layout: the headline owns the frame's top left (x < 1100, y < 360). The
      // camera holds about 1.1 round (960, 600), so world y 436 lands at the
      // headline's bottom edge; on the left everything stays below that.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.6],
          [4.6, 10.0],
          [10.0, 12.6],
        ]);
        const { blinkAt, headline } = K;
        const TEAL = '#6f9c95';

        // ---------- The office, all three acts ----------
        const g = K.act([0, 12.6]);
        K.room(g, { floor: 870, wall: '#ebe5d9', ground: '#ddd5c6' });
        CAST.dots(g, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });

        // the wall of old leads: a pinboard of contact cards, grey and dusty
        const board = S.g(g);
        S.svg('rect', { x: 1162, y: 292, width: 640, height: 452, rx: 16, fill: INK }, board);
        S.svg('rect', { x: 1150, y: 280, width: 640, height: 452, rx: 16, fill: '#d9c8a9', stroke: INK, 'stroke-width': 5 }, board);
        const boardTag = S.html('<div class="mono" style="left:1470px;top:236px;transform:translateX(-50%);font-size:22px;font-weight:600">Old leads</div>', S.hudCam);
        const CARDS = [];
        for (let j = 0; j < 3; j++)
          for (let i = 0; i < 3; i++) {
            const x = 1280 + i * 190;
            const y = 380 + j * 130;
            const c = S.g(board);
            S.svg('rect', { x: -75, y: -42, width: 156, height: 90, rx: 10, fill: INK }, c);
            S.svg('rect', { x: -80, y: -46, width: 156, height: 90, rx: 10, fill: PAPER, stroke: INK, 'stroke-width': 4 }, c);
            S.svg('circle', { cx: -48, cy: -12, r: 16, fill: SHADE, stroke: INK, 'stroke-width': 3.5 }, c);
            const tag = S.svg('rect', { x: -22, y: -20, width: 50, height: 14, rx: 7, fill: GRAY, stroke: INK, 'stroke-width': 3 }, c);
            S.svg('rect', { x: -22, y: 2, width: 80, height: 8, rx: 4, fill: GRAY }, c);
            S.svg('rect', { x: -62, y: 20, width: 110, height: 8, rx: 4, fill: GRAY }, c);
            const pin = S.svg('circle', { cx: -2, cy: -46, r: 8, fill: GRAY, stroke: INK, 'stroke-width': 3 }, c);
            const dust = S.svg('rect', { x: -82, y: -48, width: 160, height: 94, rx: 10, fill: '#ebe5d9', opacity: 0.55 }, c);
            S.put(c, { x, y });
            CARDS.push({ c, x, y, tag, pin, dust });
          }
        // a cobweb grows in the board's top left corner
        const web = S.svg('path', { d: 'M 0 0 L 92 82 M 0 0 L 0 96 M 0 0 L 104 0 M 0 34 Q 26 28 32 0 M 0 64 Q 52 58 64 0 M 0 92 Q 80 84 96 0', fill: 'none', stroke: INK, 'stroke-width': 2.5, opacity: 0.6 }, board);
        S.put(web, { x: 1156, y: 286 });
        const lastTag = S.html('<div class="chip" style="left:1470px;top:770px;transform:translateX(-50%);font-size:22px;background:#f2efe8">Last contact · months ago</div>', S.hudCam);

        // the owner at the desk
        const desk = CAST.desk(g, { w: 520, h: 190 });
        S.put(desk, { x: 600, y: 870 });
        const chair = CAST.chair(g);
        S.put(chair, { x: 300, y: 870 });
        const lap = CAST.laptop(g, { w: 240, h: 160 });
        S.put(lap.g, { x: 640, y: 680 });
        // on the screen: a message being written, line by line
        const msgLines = [0, 1, 2].map((i) => S.svg('rect', { x: -96, y: -128 + i * 24, height: 9, rx: 4.5, fill: INK, opacity: 0.8 }, lap.ui));
        const mug = CAST.mug(g);
        S.put(mug.g, { x: 800, y: 680 });
        const owner = CAST.person(g, { shirt: TEAL, hair: 'curly', hairColor: '#3a2a1e' });

        // replies: paper planes out to six of the leads; four of them answer
        const SENT = [
          [0, 5.35],
          [4, 5.75],
          [2, 6.15],
          [6, 6.55],
          [8, 6.95],
          [5, 7.35],
        ];
        const REPLIED = [0, 2, 4, 5];
        const planes = SENT.map(() => CAST.plane(g));
        const chats = REPLIED.map(() => CAST.chat(g, { w: 96, side: 1, lines: 1 }));
        const replyAt = (k) => SENT.find(([i]) => i === k)[1] + 1.15;

        // act 3: a calendar, and the four who replied land on it as calls
        const cal = CAST.calendar(g, { w: 240, h: 210, cols: 4, rows: 2 });
        const slots = [1, 2, 5, 7];
        const LAND = [10.45, 10.8, 11.15, 11.5];
        const flyers = REPLIED.map(() => {
          const e = S.g(g);
          S.svg('rect', { x: -40, y: -24, width: 80, height: 48, rx: 8, fill: PAPER, stroke: INK, 'stroke-width': 4 }, e);
          S.svg('rect', { x: -26, y: -12, width: 28, height: 10, rx: 5, fill: ORANGE, stroke: INK, 'stroke-width': 2.5 }, e);
          S.svg('rect', { x: -26, y: 6, width: 50, height: 6, rx: 3, fill: GRAY }, e);
          return e;
        });
        const ticks = slots.map(() => CAST.check(g, { r: 15 }));
        const booked = S.html('<div class="chip" style="left:1000px;top:690px;transform:translateX(-50%);font-size:22px">New calls booked</div>', S.hudCam);
        const CX = 1000, CY = 545;

        S.track((t) => {
          const act2 = t >= 4.6;
          const act3 = t >= 10.0;
          // the board: dusty, then each lead wakes as its message lands
          CARDS.forEach(({ c, x, y, tag, pin, dust }, k) => {
            const sent = SENT.find(([i]) => i === k);
            const woke = sent && t > sent[1] + 0.6;
            const flown = REPLIED.indexOf(k) >= 0 && t > LAND[REPLIED.indexOf(k)] - 0.45;
            dust.setAttribute('opacity', woke ? (0.55 * (1 - ramp(t, sent[1] + 0.6, 0.3))).toFixed(3) : '0.55');
            tag.setAttribute('fill', woke ? ORANGE : GRAY);
            pin.setAttribute('fill', woke ? ORANGE : GRAY);
            const jolt = sent ? hit(t, sent[1] + 0.6, 0.35) : 0;
            S.put(c, { x, y: y - 10 * jolt, r: 3 * jolt * (k % 2 ? 1 : -1), o: flown ? 0.25 : 1 });
          });
          S.draw(web, act2 ? 1 - ramp(t, 4.7, 0.5) : ramp(t, 1.0, 1.4, E.out));
          lastTag.style.opacity = (ramp(t, 1.9, 0.3) * (1 - ramp(t, 4.3, 0.2))).toFixed(3);
          boardTag.style.opacity = (1 - ramp(t, 9.9, 0.2)).toFixed(3);

          // the laptop: messages typed out while the planes go
          const typing = act2 && t < 7.6;
          msgLines.forEach((l, i) => {
            const w = [190, 160, 110][i] * S.clamp(((t * 2.5) % 1) * 3 - i);
            l.setAttribute('width', Math.max(0.01, typing ? w : 0).toFixed(1));
            l.style.visibility = typing && w > 0.5 ? '' : 'hidden';
          });
          planes.forEach((pl, n) => {
            const [k, a] = SENT[n];
            const p = ramp(t, a, 0.6, E.inOut);
            const tx = CARDS[k].x, ty = CARDS[k].y - 10;
            S.put(pl, { x: 690 + (tx - 690) * p, y: 560 + (ty - 560) * p - 140 * Math.sin(Math.PI * p), r: -18 + 30 * p, s: 0.6 * K.pop(t, a, a + 0.6, 0.1), o: t > a && p < 1 ? 1 : 0 });
          });
          chats.forEach((ch, n) => {
            const k = REPLIED[n];
            const a = replyAt(k);
            const gone = LAND[n] - 0.45;
            // (above the card's top right corner, clear of the card above it)
            S.put(ch, { x: CARDS[k].x + 52, y: CARDS[k].y - 50, s: K.pop(t, a, gone), o: t > a && t < gone ? 1 : 0 });
          });

          // act 3: the calendar comes up, the replies fly onto it
          const up = Math.min(1.1, S.spring(t, 10.05, { freq: 2.2, damp: 0.5 }));
          S.put(cal.g, { x: CX, y: CY, s: Math.max(0.001, up), o: act3 ? 1 : 0 });
          booked.style.opacity = ramp(t, 11.8, 0.25).toFixed(3);
          booked.style.transform = `translateX(-50%) scale(${(0.9 + 0.1 * ramp(t, 11.8, 0.4, E.back)).toFixed(3)})`;
          flyers.forEach((f, n) => {
            const k = REPLIED[n];
            const a = LAND[n] - 0.45;
            const p = ramp(t, a, 0.45, E.inOut);
            const cell = cal.cells[slots[n]];
            const x1 = CX + cell.cx, y1 = CY + cell.cy;
            S.put(f, { x: CARDS[k].x + (x1 - CARDS[k].x) * p, y: CARDS[k].y + (y1 - CARDS[k].y) * p - 90 * Math.sin(Math.PI * p), s: 1 - 0.45 * p, o: t > a && p < 1 ? 1 : 0 });
            const on = t > LAND[n];
            cell.cell.setAttribute('fill', on ? ORANGE : SHADE);
            S.put(ticks[n].g, { x: x1 + 22, y: y1 - 18, s: on ? Math.max(0.001, Math.min(1.1, S.spring(t, LAND[n], { freq: 3 }))) : 0.001 });
            ticks[n].set(ramp(t, LAND[n] + 0.1, 0.25));
          });

          // the owner: bored, then busy, then delighted
          const bored = !act2;
          const pump = act3 ? env(t, 11.6, 13, 0.2) * Math.abs(Math.sin(t * 7)) : 0;
          const tap = typing ? Math.sin(t * 32) * 6 : 0;
          const drum = bored ? Math.sin(t * 30) * 6 : 0;
          owner.set({
            x: 360, y: 870, seated: 120, leg: [[70, -70], [76, -74]],
            lean: bored ? 10 : 2, headTilt: bored ? 14 * ramp(t, 1.2, 0.8) : 0,
            arm: bored ? [[40, 60], [62, 40 + drum]] : act3 && pump > 0 ? [[64, 40], [150 - 40 * pump, 20 + 30 * pump]] : [[64, 40 + tap], [70, 34 - tap]],
            mouth: act3 ? (t > 10.5 ? 'grin' : 'o') : act2 ? (t > replyAt(0) ? 'grin' : 'smile') : t > 2.4 ? 'frown' : 'flat',
            look: act3 ? [1, -0.4] : act2 && t > 5.2 ? [1, -0.6] : [0.6, 0.4],
            blink: blinkAt(t, [1.6, 3.7, 6.3, 9.1, 11.0]),
            bob: act3 ? 4 * Math.abs(Math.sin(t * 6)) : 0,
          });
          mug.set(t);
        });

        headline(0, 'Fig. 1 · Your CRM', 'Old leads,<br /><em>gathering dust</em>.', 0.45, 4.2, { dark: false });
        headline(1, 'Fig. 2 · With Neurokov', 'They hear<br />from you <em>again</em>.', 5.1, 9.65, { dark: false });
        headline(2, 'Fig. 3 · A week later', 'Old leads,<br /><em>new clients</em>.', 10.3, 99, { dark: false });

        // ---------- The close ----------
        K.endCard({
          at: 12.6,
          kicker: 'Lead reactivation · Illustrated story',
          was: 'Old leads',
          now: 'new <em>clients</em>',
          label: 'No new leads needed · Pipeline you’ve already paid for',
          size: 112,
        });
        K.wipes([[4.6, 'With Neurokov →']]);
        K.note('Illustrated story', () => false);
        K.camera([
          [0, [960, 600, 1.1]],
          [4.6, [960, 600, 1.13], E.sine],
          [12.6, [960, 600, 1.16], E.sine],
        ]);
      });
    </script>
  </body>
</html>
