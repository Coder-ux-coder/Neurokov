<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 12s" />
    <meta name="poster" content="10.4" />
    <title>Step 02, plan and fixed price</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script>
      // Process, step 02: scope and fixed price. NK-01 writes the scope on an
      // easel, line by line; a FIXED PRICE sticker slaps on; the client walks in,
      // reads it and signs, and the stamp comes down. No amounts anywhere.
      // A 12-second loop for the process page.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([[0, 12.1]]);
        const { blinkAt, headline } = K;
        const g = K.act(0);
        S.svg('rect', { x: -600, y: -600, width: 3200, height: 2400, fill: PAPER }, g);
        K.paper(g, { floor: 870 });

        // the easel and the scope on it
        const DX = 1310, DY = 520, DW = 380, DH = 470;
        for (const [x1, x2] of [[DX - 150, DX - 210], [DX + 150, DX + 210]]) S.svg('line', { x1, y1: DY, x2, y2: 870, stroke: INK, 'stroke-width': 14, 'stroke-linecap': 'round' }, g);
        S.svg('line', { x1: DX, y1: DY, x2: DX, y2: 870, stroke: INK, 'stroke-width': 12, 'stroke-linecap': 'round' }, g);
        const doc = S.g(g);
        S.put(doc, { x: DX, y: DY });
        S.svg('rect', { x: -DW / 2 + 12, y: -DH / 2 + 14, width: DW, height: DH, rx: 14, fill: INK }, doc);
        S.svg('rect', { x: -DW / 2, y: -DH / 2, width: DW, height: DH, rx: 14, fill: PAPER, stroke: INK, 'stroke-width': 6 }, doc);
        const title = S.svg('text', { x: -DW / 2 + 30, y: -DH / 2 + 52, 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 28, 'letter-spacing': 4, fill: INK }, doc);
        title.textContent = 'PLAN';
        S.svg('rect', { x: -DW / 2 + 30, y: -DH / 2 + 66, width: 90, height: 7, rx: 3.5, fill: ORANGE }, doc);
        const ROWS = 6;
        const rows = Array.from({ length: ROWS }, (_, i) => {
          const y = -DH / 2 + 110 + i * 40;
          const box = S.svg('rect', { x: -DW / 2 + 30, y: y - 12, width: 24, height: 24, rx: 5, fill: PAPER, stroke: INK, 'stroke-width': 3.5 }, doc);
          const tick = S.svg('path', { d: `M ${-DW / 2 + 34} ${y} L ${-DW / 2 + 41} ${y + 7} L ${-DW / 2 + 52} ${y - 8}`, fill: 'none', stroke: ORANGE, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, doc);
          const line = S.svg('rect', { x: -DW / 2 + 70, y: y - 5, height: 10, rx: 5, fill: INK, opacity: 0.8 }, doc);
          return { box, tick, line, w: [250, 210, 270, 180, 236, 150][i], y };
        });
        const writeAt = (i) => 1.5 + i * 0.55;
        // the signature line
        S.svg('line', { x1: -DW / 2 + 30, y1: DH / 2 - 44, x2: -DW / 2 + 200, y2: DH / 2 - 44, stroke: INK, 'stroke-width': 3, opacity: 0.5 }, doc);
        const sig = S.svg('path', { d: `M ${-DW / 2 + 34} ${DH / 2 - 56} c 10 -26 22 18 34 -4 c 8 -16 16 14 28 -2 c 10 -14 18 12 32 -6 c 8 -8 16 4 30 -4`, fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, doc);

        // the sticker and the stamp
        const sticker = S.g(g);
        S.svg('rect', { x: -122, y: -30, width: 244, height: 60, rx: 12, fill: ORANGE, stroke: INK, 'stroke-width': 5 }, sticker);
        S.svg('circle', { cx: -98, cy: 0, r: 8, fill: PAPER, stroke: INK, 'stroke-width': 3 }, sticker);
        const st = S.svg('text', { x: 16, y: 9, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 24, 'letter-spacing': 2, fill: INK }, sticker);
        st.textContent = 'FIXED PRICE';
        const stamp = S.g(g);
        S.svg('rect', { x: -112, y: -36, width: 224, height: 72, rx: 10, fill: PAPER, 'fill-opacity': 0.55, stroke: ORANGE, 'stroke-width': 7 }, stamp);
        const sx = S.svg('text', { x: 0, y: 14, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 38, 'letter-spacing': 6, fill: ORANGE }, stamp);
        sx.textContent = 'AGREED';
        const sparks = [0, 1, 2].map(() => CAST.sparkle(g, { r: 20 }));

        // NK-01 writes, from the right of the easel
        const bot = CAST.robot(g);
        const pencil = S.g(g);
        S.svg('path', { d: 'M 0 0 L 12 -8 L 70 -8 L 70 8 L 12 8 Z', fill: '#ffd166', stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, pencil);
        S.svg('path', { d: 'M 0 0 L 12 -8 L 12 8 Z', fill: INK }, pencil);
        S.svg('rect', { x: 62, y: -8, width: 14, height: 16, rx: 3, fill: ORANGE, stroke: INK, 'stroke-width': 4 }, pencil);

        // the client walks in from the left, reads, signs
        const client = CAST.person(g, { shirt: '#5b7fa6', hair: 'bob', hairColor: '#3a2a1e' });
        const pen = S.svg('path', { d: 'M 0 0 L 6 -6 L 44 -44 L 38 -50 L 0 -12 Z', fill: INK }, g);

        S.track((t) => {
          // the scope, written line by line
          rows.forEach(({ tick, line, w }, i) => {
            const a = writeAt(i);
            const k = ramp(t, a, 0.4, E.linear);
            line.setAttribute('width', Math.max(0.01, w * k).toFixed(1));
            line.style.visibility = k > 0 ? '' : 'hidden';
            S.draw(tick, ramp(t, a + 0.38, 0.14, E.linear));
          });
          const writing = t > writeAt(0) && t < writeAt(ROWS - 1) + 0.45;
          const row = Math.min(ROWS - 1, Math.max(0, Math.floor((t - 1.5) / 0.55)));
          const inRow = ramp(t, writeAt(row), 0.4, E.linear);

          // NK-01
          const arrive = ramp(t, 0.4, 1.0, E.out);
          const bx = 2200 + (1600 - 2200) * arrive;
          const by = 470 + 6 * Math.sin(t * 3) + (writing ? (rows[row].y - (-DH / 2 + 110)) * 0.35 : 0);
          const done = t > 8.7;
          bot.set({
            x: bx, y: by, t, flip: -1, ground: 870 - by, tilt: arrive < 1 ? -14 * (1 - arrive) : 0,
            flame: arrive < 1 ? 0.8 : 0.25, glow: 0.5 + 0.5 * S.wave(t, 0.7),
            arm: done ? [[25, -25], [150, -20 + 22 * Math.sin(t * 9)]] : writing ? [[20, -20], [100 + 10 * Math.sin(t * 18), -30]] : [[20, -20], [-20, 20]],
            eyes: done ? 'happy' : 'normal', look: writing ? [0.8, 0.2] : [0.4, 0],
            blink: blinkAt(t, [0.9, 5.3, 7.9, 10.6]),
          });
          const [hx, hy] = bot.hand;
          S.put(pencil, { x: bx - hx - 6, y: by + hy + 4, r: 10 + 8 * Math.sin(t * 18) * (writing ? 1 : 0), s: K.pop(t, -1, 8.7), o: t > 0.4 && !done ? 1 : 0 });

          // the sticker slaps on, then the client, then the stamp
          const sk = Math.min(1.1, S.spring(t, 5.1, { freq: 3, damp: 0.38 }));
          S.put(sticker, { x: DX + 60, y: DY + 150, r: -6, s: Math.max(0.001, 1.6 - 0.6 * Math.min(1.1, sk)), o: t > 5.1 ? 1 : 0 });

          const walk = ramp(t, 5.5, 1.5, E.out);
          const moving = t > 5.5 && t < 7.0;
          const ph = t * 11;
          const a = moving ? 22 * Math.sin(ph) * (1 - walk * 0.6) : 0;
          const drop = 150 * (1 - Math.cos((a * Math.PI) / 180));
          const signing = env(t, 7.15, 8.2, 0.2);
          const happy = t > 8.6;
          client.set({
            x: -200 + (1010 + 200) * walk, y: 870, bob: -drop,
            leg: [[a, -20 * Math.max(0, Math.sin(ph)) * (moving ? 1 : 0)], [-a, -20 * Math.max(0, -Math.sin(ph)) * (moving ? 1 : 0)]],
            arm: signing > 0 ? [[8, -10], [50, 30]] : happy ? [[8, -10], [150, 30 + 10 * Math.sin(t * 8)]] : [[-a * 0.7 + 6, -10], [a * 0.7 - 6, 10]],
            lean: 6 * signing, headTilt: t > 6.9 && t < 7.2 ? 8 : 4 * signing,
            mouth: happy ? 'grin' : 'smile', look: t > 6.8 && !happy ? [1, 0.3] : [1, 0],
            blink: blinkAt(t, [6.2, 9.4, 11.3]),
          });
          const [chx, chy] = client.hand;
          S.put(pen, { x: -200 + (1010 + 200) * walk + chx + 2, y: 870 + chy + 18, r: 8 * Math.sin(t * 20) * signing, s: Math.max(0.001, S.clamp(signing / 0.5)), o: signing > 0.001 ? 1 : 0 });
          S.draw(sig, ramp(t, 7.35, 0.75, E.inOut));

          const stk = S.spring(t, 8.6, { freq: 3, damp: 0.35 });
          S.put(stamp, { x: DX + 40, y: DY - 20, r: -10, s: Math.max(0.001, 2.2 - 1.2 * Math.min(1.1, stk)), o: t > 8.6 ? 1 : 0 });
          sparks.forEach((sp, i) => {
            const at = 8.8 + i * 0.18;
            const p = Math.min(1, S.spring(t, at, { freq: 2.4, damp: 0.5 }));
            S.put(sp, { x: [DX - 250, DX + 250, DX + 190][i], y: [DY - 200, DY - 230, DY + 120][i], s: Math.max(0.001, p) * (1 + 0.12 * Math.sin(t * 6 + i)), r: 20 * t, o: t > at ? 1 : 0 });
          });
        });

        headline(0, 'Step 02 · One fixed price', 'One plan,<br /><em>one price</em>.', 0.3, 99, { dark: false });
        K.note('Illustrated story · How working with us goes', () => false);
        K.camera(
          [
            [0, [1000, 560, 1.06]],
            [12, [1030, 560, 1.1], E.linear],
          ],
          [[8.6, 0.3, 0.5]],
        );
      });
    </script>
  </body>
</html>
