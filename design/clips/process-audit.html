<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 12s" />
    <meta name="poster" content="10.6" />
    <title>Step 01, the free audit</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script>
      // Process, step 01: the free systems audit. The business as a pipeline
      // (leads, sales, ops, billing) leaking at three joints; NK-01 goes along it
      // with a magnifier, flags the leaks by payoff and hands over the plan.
      // A 12-second loop for the process page.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([[0, 12.1]]);
        const { blinkAt, headline } = K;
        const g = K.act(0);
        S.svg('rect', { x: -600, y: -600, width: 3200, height: 2400, fill: PAPER }, g);
        K.paper(g, { floor: 870 });

        // the pipeline, with the business's departments along it
        const PY = 620;
        S.svg('line', { x1: 100, y1: PY, x2: 1840, y2: PY, stroke: INK, 'stroke-width': 48, 'stroke-linecap': 'round' }, g);
        S.svg('line', { x1: 100, y1: PY, x2: 1840, y2: PY, stroke: GRAY, 'stroke-width': 36, 'stroke-linecap': 'round' }, g);
        const flow = S.svg('line', { x1: 100, y1: PY, x2: 1840, y2: PY, stroke: ORANGE, 'stroke-width': 12, 'stroke-dasharray': '22 26', 'stroke-linecap': 'round' }, g);
        for (const x of [420, 600, 880, 1060, 1340, 1520]) S.svg('rect', { x: x - 9, y: PY - 30, width: 18, height: 60, rx: 5, fill: INK }, g);
        const lights = [
          [280, 'LEADS'],
          [740, 'SALES'],
          [1200, 'OPS'],
          [1660, 'BILLING'],
        ].map(([x, name], i) => {
          const b = S.g(g);
          S.put(b, { x, y: PY });
          S.svg('rect', { x: -95 + 10, y: -75 + 12, width: 190, height: 150, rx: 18, fill: INK }, b);
          S.svg('rect', { x: -95, y: -75, width: 190, height: 150, rx: 18, fill: PAPER, stroke: INK, 'stroke-width': 6 }, b);
          const tx = S.svg('text', { x: 0, y: 10, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 26, 'letter-spacing': 3, fill: INK }, b);
          tx.textContent = name;
          S.svg('rect', { x: -60, y: 32, width: 120, height: 8, rx: 4, fill: SHADE }, b);
          return S.svg('circle', { cx: 68, cy: -50, r: 9, fill: ORANGE, stroke: INK, 'stroke-width': 3 }, b);
        });

        // three leaks, big to small by what they cost: drops fall and pool
        const LEAKS = [
          { x: 970, n: '01', size: 1.25, period: 0.22 },
          { x: 510, n: '02', size: 1.0, period: 0.36 },
          { x: 1430, n: '03', size: 0.8, period: 0.6 },
        ];
        LEAKS.forEach((L) => {
          S.svg('path', { d: `M ${L.x - 14} ${PY + 20} L ${L.x - 6} ${PY + 12} L ${L.x} ${PY + 22} L ${L.x + 8} ${PY + 10} L ${L.x + 14} ${PY + 20}`, fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, g);
          L.pool = S.svg('ellipse', { cx: L.x, cy: 872, fill: ORANGE, stroke: INK, 'stroke-width': 3 }, g);
          const M = Math.ceil(0.5 / L.period) + 1;
          L.drops = Array.from({ length: M }, () => S.svg('path', { d: 'M 0 -14 C 8 -2 10 4 0 10 C -10 4 -8 -2 0 -14 Z', fill: ORANGE, stroke: INK, 'stroke-width': 3 }, g));
          L.M = M;
        });
        S.track((t) => {
          flow.setAttribute('stroke-dashoffset', (-t * 140).toFixed(1));
          lights.forEach((l, i) => l.setAttribute('opacity', (0.45 + 0.55 * S.wave(t, 1.4, i * 0.3)).toFixed(2)));
          LEAKS.forEach((L) => {
            L.drops.forEach((d, j) => {
              const u = (t + j * L.period) % (L.M * L.period);
              const p = S.clamp(u / 0.45);
              S.put(d, { x: L.x, y: PY + 28 + (866 - PY - 28) * E.in(p), s: L.size, o: u < 0.45 ? 1 : 0 });
            });
            const rx = 38 * L.size * (0.55 + 0.45 * ramp(t, 0, 12, E.linear));
            L.pool.setAttribute('rx', rx.toFixed(1));
            L.pool.setAttribute('ry', (rx * 0.2).toFixed(1));
          });
        });

        // the flags NK-01 pins on each leak: each pops up just as NK-01 and its lens
        // have moved on from it, so nothing ever passes over one (01, 02, 03)
        const FLAG_AT = [5.75, 7.55, 3.65];
        const flags = LEAKS.map((L, i) => {
          const f = S.g(g);
          S.svg('rect', { x: -4, y: -96, width: 8, height: 96, fill: INK }, f);
          S.svg('path', { d: 'M 4 -96 L 82 -96 L 68 -73 L 82 -50 L 4 -50 Z', fill: i === 0 ? ORANGE : '#ffd166', stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, f);
          const tx = S.svg('text', { x: 36, y: -64, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 23, fill: INK }, f);
          tx.textContent = L.n;
          return f;
        });

        // the plan, handed over at the end
        const plan = S.g(g);
        S.svg('rect', { x: -155 + 10, y: -112 + 12, width: 310, height: 224, rx: 16, fill: INK }, plan);
        S.svg('rect', { x: -155, y: -112, width: 310, height: 224, rx: 16, fill: PAPER, stroke: INK, 'stroke-width': 5 }, plan);
        const pt = S.svg('text', { x: -128, y: -68, 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 22, 'letter-spacing': 3, fill: INK }, plan);
        pt.textContent = 'THE PLAN';
        S.svg('rect', { x: -128, y: -56, width: 64, height: 6, rx: 3, fill: ORANGE }, plan);
        const rows = ['01', '02', '03'].map((n, i) => {
          const y = -18 + i * 46;
          S.svg('rect', { x: -128, y: y - 15, width: 50, height: 30, rx: 7, fill: i === 0 ? ORANGE : '#ffd166', stroke: INK, 'stroke-width': 3 }, plan);
          const tx = S.svg('text', { x: -103, y: y + 7, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 18, fill: INK }, plan);
          tx.textContent = n;
          S.svg('rect', { x: -64, y: y - 4, width: [150, 120, 96][i], height: 8, rx: 4, fill: INK, opacity: 0.75 }, plan);
          const ck = CAST.check(plan, { r: 15 });
          return { ck, y };
        });

        // NK-01: in from the right, along the pipe right to left, then over to the plan
        const bot = CAST.robot(g);
        const lens = CAST.magnifier(g, { r: 36 });
        const X = (L) => L.x + 199; // where NK-01 hovers so its lens is over leak L
        const PATH = [
          [0.8, [2200, 380]],
          [2.0, [X(LEAKS[2]), 460], E.out],
          [3.1, [X(LEAKS[2]), 460]],
          [4.0, [X(LEAKS[0]), 460]],
          [5.2, [X(LEAKS[0]), 460]],
          [6.1, [X(LEAKS[1]), 460]],
          [7.3, [X(LEAKS[1]), 460]],
          // home in an arc over the flags (never across one), and down beside the
          // plan before it pops up
          [7.75, [930, 345], E.in],
          [8.3, [1690, 345], E.linear],
          [8.7, [1790, 455], E.out],
        ];
        const INSPECT = [
          [2.0, 3.1, 2],
          [4.0, 5.2, 0],
          [6.1, 7.3, 1],
        ];
        S.track((t) => {
          const [x, y0] = S.kf(t, PATH);
          const moving = !INSPECT.some(([a, b]) => t >= a && t < b) && t > 0.8 && t < 8.7;
          const done = t >= 8.7;
          const bob = 6 * Math.sin(t * 3);
          const y = y0 + bob;
          // (the lens is put away as it leaves the last leak)
          const holding = t < 7.3;
          bot.set({
            x, y, t, flip: -1, ground: 870 - y,
            tilt: moving ? (t < 2 ? -12 : 10) : 0,
            flame: moving ? 0.8 : 0.25,
            glow: 0.5 + 0.5 * S.wave(t, 0.7),
            arm: holding ? [[20, -20], [40, 40]] : done ? [[25, -25], [150, -20 + 20 * Math.sin(t * 9)]] : [[20, -20], [-20, 20]],
            eyes: done ? 'happy' : moving ? 'normal' : 'wide',
            look: holding && !moving ? [0.5, 1] : [0.3, 0],
            blink: blinkAt(t, [1.6, 4.6, 9.4, 11.2]),
          });
          const [hx, hy] = bot.hand;
          const away = ramp(t, 7.3, 0.18, E.in);
          S.put(lens, { x: x - hx - 61, y: y + hy + 61, r: -90, s: Math.max(0.001, 1 - away), o: t > 0.8 && away < 1 ? 1 : 0 });

          flags.forEach((f, i) => {
            const at = FLAG_AT[i];
            const k = Math.min(1.15, S.spring(t, at, { freq: 2.6, damp: 0.4 }));
            S.put(f, { x: LEAKS[i].x + 34, y: PY - 24, s: Math.max(0.001, k), r: 4 * Math.sin(t * 3 + i), o: t > at ? 1 : 0 });
          });

          const pk = Math.min(1.08, S.spring(t, 8.45, { freq: 2.2, damp: 0.45 }));
          S.put(plan, { x: 1470, y: 250 + 60 * (1 - Math.min(1, pk)), s: Math.max(0.001, pk), r: -2, o: t > 8.45 ? 1 : 0 });
          rows.forEach(({ ck, y: ry }, i) => {
            const a = 8.9 + i * 0.35;
            const k = Math.min(1.15, S.spring(t, a, { freq: 2.8, damp: 0.4 }));
            S.put(ck.g, { x: 120, y: ry, s: Math.max(0.001, k), o: t > a ? 1 : 0 });
            ck.set(ramp(t, a + 0.08, 0.25, E.out));
          });
        });

        headline(0, 'Step 01 · 100% free', 'Find the<br /><em>leaks</em>.', 0.3, 99, { dark: false });
        K.note('Illustrated story · How a project works', () => false);
        K.camera([
          [0, [960, 560, 1]],
          [12, [960, 560, 1.04], E.linear],
        ]);
      });
    </script>
  </body>
</html>
