<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 20s" />
    <meta name="poster" content="2.2" />
    <title>Welcome</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script>
      // The welcome clip, for the guide that greets new visitors. NK-01 says
      // hello, the busywork piles up at a desk, NK-01 clears it, and the
      // guarantee is stamped onto the scope. Illustrated; the only numbers are
      // the site's own stats.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.2],
          [4.2, 8.8],
          [8.8, 15.2],
          [15.2, 20.1],
        ]);
        const { blinkAt, headline } = K;

        // ---------- Act 1: hello ----------
        const g1 = K.act(0);
        S.svg('rect', { x: -600, y: -600, width: 3200, height: 2400, fill: PAPER }, g1);
        K.paper(g1);
        const sign = CAST.sign(g1, { h: 150, size: 190 });
        S.put(sign.g, { x: 470, y: 870 });
        S.put(CAST.plant(g1), { x: 250, y: 870, s: 1.1 });
        const trail = S.svg('path', { d: 'M 2350 40 C 1950 60 1480 260 1250 560', fill: 'none', stroke: ORANGE, 'stroke-width': 6, 'stroke-dasharray': '4 18', 'stroke-linecap': 'round' }, g1);
        const bot1 = CAST.robot(g1);
        const land1 = CAST.burst(g1, { color: ORANGE, r0: 130, r1: 190 });
        S.put(land1.g, { x: 1250, y: 560 });
        S.track((t) => {
          if (!trail._len) trail._len = trail.getTotalLength();
          const p = ramp(t, 0.15, 0.95, E.out);
          const pt = trail.getPointAtLength(p * trail._len);
          const settle = t < 1.1 ? 0 : 1 - S.spring(t, 1.1, { freq: 2, damp: 0.35 });
          const bob = 10 * Math.sin((t - 1.1) * 2.6) * ramp(t, 1.1, 0.6);
          const waving = env(t, 1.35, 3.5, 0.25);
          bot1.set({
            x: pt.x, y: pt.y + 26 * settle + bob, s: 1.4, t, tilt: -24 * (1 - p) + 6 * settle,
            ground: 310 - bob, flame: 0.35 + 0.65 * (1 - p), glow: 0.6 + 0.4 * S.wave(t, 0.8),
            arm: [[25, -25], [waving > 0 ? 150 - 10 * waving : -20, waving > 0 ? -20 + 34 * Math.sin(t * 13) * waving : 20]],
            eyes: t > 1.1 && t < 1.35 ? 'wide' : t >= 1.35 ? 'happy' : 'normal', squash: hit(t, 1.1, 0.35),
            blink: blinkAt(t, [0.9]),
          });
          land1.set(ramp(t, 1.1, 0.45, E.linear));
          trail.setAttribute('stroke-dashoffset', (-t * 40).toFixed(1));
          trail.setAttribute('opacity', (ramp(t, 0.2, 0.3) * (1 - ramp(t, 1.2, 0.5))).toFixed(3));
        });
        const bub1 = CAST.bubble(g1, { w: 470, h: 110, tail: 'left' });
        const say1 = K.hudAct(S.html('<div class="say" style="left:1520px;top:300px;font-size:36px"></div>', S.hudCam), 0);
        S.track((t) => {
          const p = S.spring(t, 1.45, { freq: 2.4, damp: 0.45 });
          // the bubble shrinks away with its words still in it
          const out = ramp(t, 3.75, 0.25, E.in);
          const s = Math.max(0.001, Math.min(p, 1.2) * (1 - out));
          S.put(bub1, { x: 1520, y: 300, s, o: p > 0.02 ? 1 : 0 });
          if (t < 2.55) S.type(t, say1, 'Hi! I’m NK-01.', 1.6, 30);
          else S.type(t, say1, 'Let me show you around.', 2.6, 30);
          say1.style.transform = `translate(-50%,-50%) scale(${s.toFixed(4)})`;
          say1.style.opacity = t < 1.6 ? 0 : 1;
        });
        headline(0, 'Hi · Your guide today is NK-01', 'Welcome to<br /><em>Neurokov</em>.', 0.4, 3.8, { dark: false });

        // ---------- Acts 2 and 3: the desk, before and after ----------
        const office = K.act([4.2, 15.2]);
        K.room(office, { floor: 870, wall: '#ebe5d9', ground: '#ddd5c6' });
        CAST.dots(office, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });
        const clock = CAST.clock(office, { r: 58 });
        S.put(clock.g, { x: 1440, y: 330 });
        // the week racing by, then a normal day
        S.track((t) => clock.set(9 + 6 * ramp(t, 4.2, 4.6, E.linear) + (t > 8.8 ? (t - 8.8) / 12 : 0)));
        // [text, x, y, tilt, when it goes up, where it falls to]: the one on the
        // left falls out past the frame's left edge, clear of the footnote
        const notes = [
          ['Invoices!', 1240, 300, -6, 5.0, [40, 900]],
          ['Follow up', 1640, 300, 5, 5.9, [40, 900]],
          ['Report\ndue', 330, 560, -5, 6.8, [-500, 600]],
        ].map(([text, x, y, r, at, [dx, dy]], i) => {
          // (each is ticked with a badge on a top corner, the far one for the note by his head)
          const n = CAST.sticky(office, { text, w: 130, size: 21, fill: i === 1 ? '#ffb38a' : '#ffd166', badge: dx < 0 ? -1 : 1 });
          S.track((t) => {
            const p = Math.min(1.1, S.spring(t, at, { freq: 2.6, damp: 0.4 }));
            const fall = ramp(t, 12.9 + i * 0.15, 0.7, E.in);
            S.put(n.g, { x: x + dx * fall, y: y + dy * fall, r: r + Math.sign(dx) * 70 * fall, s: Math.max(0.001, p), o: t > at ? 1 : 0 });
            n.set(ramp(t, 12.0 + i * 0.25, 0.4, E.out));
          });
          return n;
        });
        const table = CAST.table(office, { w: 240, h: 150 });
        S.put(table, { x: 1640, y: 870 });
        const tray = CAST.tray(office, { w: 190 });
        S.put(tray.g, { x: 1640, y: 720 });
        const desk = CAST.desk(office, { w: 660, h: 190 });
        S.put(desk, { x: 890, y: 870 });
        const chair = CAST.chair(office);
        S.put(chair, { x: 560, y: 870 });
        const owner = CAST.person(office, { shirt: '#5b7fa6', hair: 'curly', glasses: true });
        const mug = CAST.mug(office);
        const lap = CAST.laptop(office, { w: 300, h: 190 });
        S.put(lap.g, { x: 860, y: 680 });
        // the inbox on the laptop fills up, then empties
        const rows = [0, 1, 2, 3].map((i) => {
          const r = S.g(lap.ui);
          S.svg('rect', { x: -126, y: -164 + i * 36, width: 252, height: 28, rx: 7, fill: i % 2 ? SHADE : '#ffe2cf', stroke: INK, 'stroke-width': 2.5 }, r);
          S.svg('rect', { x: -114, y: -154 + i * 36, width: 90 + 30 * (i % 2), height: 9, rx: 4.5, fill: INK }, r);
          S.svg('circle', { cx: 104, cy: -150 + i * 36, r: 7, fill: ORANGE, stroke: INK, 'stroke-width': 2.5 }, r);
          return r;
        });
        const done = CAST.check(lap.ui, { r: 34 });
        S.put(done.g, { y: -96 });
        const sweats = [0, 1, 2].map(() => CAST.sweat(office));
        // the pile of paper: 16 sheets at its worst (any taller and its top would
        // crowd the next headline's "systems" as it rises)
        const N = 16;
        const stack = CAST.stack(office, { n: N, w: 150 });
        S.put(stack.g, { x: 1130, y: 680 });
        const arriveAt = (k) => (k < 4 ? -1 : 4.5 + (k - 4) * 0.25);
        const leaveAt = (k) => 10.0 + (N - 1 - k) * 0.11; // top sheet first
        stack.sheets.forEach((sh, k) =>
          S.track((t) => {
            const a = arriveAt(k);
            const drop = a < 0 ? 0 : 1 - ramp(t, a, 0.2, E.in);
            sh.setAttribute('transform', `translate(0 ${(-80 * drop).toFixed(1)})`);
            sh.style.visibility = (a < 0 || t > a) && t < leaveAt(k) ? '' : 'hidden';
            // (each fades in as it starts to drop, rather than appearing in mid-air)
            if (a >= 0) sh.style.opacity = ramp(t, a, 0.12, E.linear).toFixed(3);
          }),
        );
        S.track((t) => {
          const shown = stack.sheets.filter((sh) => sh.style.visibility !== 'hidden').length;
          const sway = Math.sin(t * 3.1) * 2.6 * Math.max(0, (shown - 6) / 12);
          S.put(stack.g, { x: 1130, y: 680, r: sway });
        });
        // mail pours into the tray, in from the right (under the notes on the wall)
        const M = 8;
        const mail = Array.from({ length: M }, (_, i) => {
          const e = CAST.envelope(office, { w: 96, h: 64 });
          const at = 4.6 + i * 0.42;
          const rest = [1640 + ((i * 37) % 50) - 25, 700 - i * 13, ((i * 53) % 24) - 12];
          const out = 10.95 + (M - 1 - i) * 0.13;
          S.track((t) => {
            const fall = ramp(t, at, 0.42, E.in);
            const fly = ramp(t, out, 0.3, E.inOut);
            const x = 2040 + (rest[0] - 2040) * fall + (1400 - rest[0]) * fly;
            const y = 480 + (rest[1] - 480) * fall - 80 * Math.sin(Math.PI * fall) + (540 - rest[1]) * fly - 60 * Math.sin(Math.PI * fly);
            // (it shrinks away to nothing as it reaches NK-01)
            S.put(e.g, { x, y, r: rest[2] * (1 - fly) + 200 * (1 - fall), s: Math.max(0.001, 1 - 0.7 * fly - 0.3 * ramp(fly, 0.7, 0.3, E.linear)), o: t > at && fly < 1 ? 1 : 0 });
          });
          return e;
        });
        // pages fly off the stack into NK-01, and replies fly out as planes
        const pages = Array.from({ length: N }, (_, k) => {
          const pg = S.g(office);
          S.svg('rect', { x: -45, y: -58, width: 90, height: 116, rx: 6, fill: PAPER, stroke: INK, 'stroke-width': 4 }, pg);
          for (let j = 0; j < 4; j++) S.svg('rect', { x: -30, y: -40 + j * 22, width: j === 3 ? 34 : 60, height: 8, rx: 4, fill: GRAY }, pg);
          const at = leaveAt(k);
          S.track((t) => {
            const p = ramp(t, at, 0.32, E.inOut);
            const x0 = 1130, y0 = 680 - (k + 1) * 16;
            S.put(pg, { x: x0 + (1395 - x0) * p, y: y0 + (545 - y0) * p - 120 * Math.sin(Math.PI * p), r: 200 * p, s: Math.max(0.001, 0.9 - 0.6 * p - 0.3 * ramp(p, 0.7, 0.3, E.linear)), o: t > at && p < 1 ? 1 : 0 });
          });
          return pg;
        });
        const launches = [...Array.from({ length: N }, (_, k) => leaveAt(k) + 0.34), ...Array.from({ length: M }, (_, i) => 10.95 + (M - 1 - i) * 0.13 + 0.32)];
        launches.forEach((at, j) => {
          const pl = CAST.plane(office);
          const dy = ((j * 71) % 160) - 80;
          S.track((t) => {
            const p = ramp(t, at, 0.6, E.in);
            S.put(pl, { x: 1440 + 520 * p, y: 520 + dy * p - 320 * p, r: -26 + dy * 0.08, s: (0.55 + 0.1 * p) * K.pop(t, at), o: t > at && p < 1 ? 1 : 0 });
          });
        });
        const bot = CAST.robot(office);
        const land = CAST.burst(office, { color: ORANGE, r0: 110, r1: 170 });
        S.put(land.g, { x: 1395, y: 560 });
        S.track((t) => {
          const drop = S.spring(t, 9.15, { freq: 1.6, damp: 0.45 });
          const bob = 9 * Math.sin(t * 2.6) * ramp(t, 9.6, 0.5);
          const y = 560 + bob - 820 * (1 - drop);
          const busy = env(t, 9.95, 12.35, 0.15);
          const wave = env(t, 12.8, 15.2, 0.3);
          const jug = Math.sin(t * 16);
          bot.set({
            x: 1395, y, s: 1.15, t, ground: 310 - bob + 820 * (1 - drop), glow: 0.5 + 0.5 * Math.max(busy, S.wave(t, 0.9)), flame: 0.45,
            // (its front arm juggles out to the side, never in across its name)
            arm: [[40 + 50 * busy * jug, -40], wave > 0 ? [-150 + 24 * Math.sin(t * 12), -30] : [-10 - 30 * busy * jug, 40]],
            eyes: t > 9.5 && t < 9.9 ? 'wide' : wave > 0 ? 'happy' : 'normal', look: wave > 0 ? [-0.8, 0.2] : busy > 0 ? [-0.7, 0.4] : [0, 0],
            squash: hit(t, 9.5, 0.35), blink: blinkAt(t, [10.4, 11.9]),
          });
          land.set(ramp(t, 9.5, 0.45, E.linear));
        });
        // the owner: buried, slumped, then sitting back with a coffee
        S.track((t) => {
          const typing = env(t, 4.3, 8.0, 0.2);
          const slump = env(t, 8.05, 9.5, 0.4, 0.15);
          const back = ramp(t, 12.6, 0.6, E.back);
          const sip = env(t, 13.4, 14.3, 0.3);
          const tap = Math.sin(t * 34) * 6 * typing;
          const glance = t < 8 ? S.kf(t, [[5.0, [0.6, 0.2]], [5.3, [1, -0.6]], [6.2, [1, -0.6]], [6.5, [0.6, 0.2]], [6.9, [1, 0.1]], [7.4, [1, 0.1]], [7.7, [0.6, 0.3]]]) : [1, 0];
          owner.set({
            x: 610, y: 870, seated: 120, leg: [[70, -70], [76, -74]],
            lean: 22 * slump - 14 * back, headTilt: 18 * slump - 4 * back,
            arm: back > 0 ? [[10, 20], [30 + 40 * sip, 100 * back + 25 * sip]] : [[64, 40 + tap], [70, 34 - tap]],
            mouth: t < 8 ? 'o' : t < 9.5 ? 'frown' : t < 10.2 ? 'o' : t < 12.6 ? 'smile' : 'grin',
            look: t < 9.5 ? glance : [1, 0], blink: slump > 0.5 ? 1 : blinkAt(t, [5.6, 7.2, 11.2, 14.6]),
          });
          const [hx, hy] = owner.hand;
          S.put(mug.g, { x: 610 + hx, y: 870 + hy + 32, s: K.pop(t, 12.6, Infinity, 0.2), o: t > 12.6 ? 1 : 0 });
          mug.set(t);
          [5.4, 6.3, 7.1].forEach((a, i) => {
            S.put(sweats[i].g, { x: 610 + 40, y: 870 - 120 - 190 });
            sweats[i].set(ramp(t, a, 0.6, E.linear));
          });
          rows.forEach((r, i) => S.put(r, { o: Math.min(ramp(t, 4.7 + i * 0.7, 0.12, E.linear), 1 - ramp(t, 11.18 + i * 0.12, 0.12, E.linear)) }));
          const dn = S.spring(t, 11.85, { freq: 2.6, damp: 0.4 });
          S.put(done.g, { y: -96, s: Math.max(0.001, Math.min(dn, 1.15)), o: t > 11.85 ? 1 : 0 });
          done.set(ramp(t, 12.0, 0.3, E.out));
        });
        headline(1, 'Fig. 1 · Sound familiar?', 'Busywork eats<br />your <em>whole week</em>.', 4.65, 8.4, { dark: false });
        headline(2, 'Fig. 2 · With Neurokov', 'We build systems<br />that <em>do it for you</em>.', 9.4, 14.8, { dark: false });

        // ---------- Act 4: the promise, stamped ----------
        const g4 = K.act(3);
        S.svg('rect', { x: -600, y: -600, width: 3200, height: 2400, fill: '#2b2f39' }, g4);
        CAST.dots(g4, { x0: -600, y0: -600, w: 3200, h: 2400, color: PAPER, o: 0.06 });
        const sheet = S.g(g4);
        S.svg('rect', { x: -372, y: -238, width: 760, height: 500, rx: 14, fill: INK }, sheet);
        S.svg('rect', { x: -380, y: -250, width: 760, height: 500, rx: 14, fill: PAPER, stroke: INK, 'stroke-width': 5 }, sheet);
        const title = S.svg('text', { x: -330, y: -178, 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 34, 'letter-spacing': 4, fill: INK }, sheet);
        title.textContent = 'SCOPE';
        const sub = S.svg('text', { x: -200, y: -180, 'font-family': 'IBM Plex Mono', 'font-weight': 500, 'font-size': 19, 'letter-spacing': 1.5, fill: '#6b665e' }, sheet);
        sub.textContent = 'WHAT YOUR SYSTEM WILL DO';
        S.svg('line', { x1: -330, y1: -150, x2: 330, y2: -150, stroke: INK, 'stroke-width': 3 }, sheet);
        const items = ['Reply to every new lead', 'Book calls onto your calendar', 'Keep the CRM up to date', 'Send the weekly report'];
        const itemTicks = items.map((label, i) => {
          const y = -100 + i * 58;
          S.svg('rect', { x: -330, y: y - 20, width: 30, height: 30, rx: 6, fill: PAPER, stroke: INK, 'stroke-width': 4 }, sheet);
          const tk = S.svg('path', { d: `M ${-325} ${y - 6} L ${-316} ${y + 4} L ${-298} ${y - 16}`, fill: 'none', stroke: ORANGE, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, sheet);
          const tx = S.svg('text', { x: -280, y: y + 3, 'font-family': 'Archivo Variable', 'font-weight': 650, 'font-size': 28, fill: INK }, sheet);
          tx.textContent = label;
          return tk;
        });
        const sig = S.svg('path', { d: 'M -320 200 C -300 160 -280 230 -250 190 C -230 160 -220 215 -190 196 C -170 184 -160 205 -130 190', fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, sheet);
        S.svg('line', { x1: -330, y1: 214, x2: -60, y2: 214, stroke: INK, 'stroke-width': 2.5, opacity: 0.5 }, sheet);
        // the imprint the stamp leaves
        const ink = S.g(sheet);
        S.svg('rect', { x: -170, y: -84, width: 340, height: 168, rx: 16, fill: 'none', stroke: ORANGE, 'stroke-width': 7 }, ink);
        S.svg('rect', { x: -158, y: -72, width: 316, height: 144, rx: 9, fill: 'none', stroke: ORANGE, 'stroke-width': 2.5 }, ink);
        const inkTxt = [
          ['NEUROKOV GUARANTEE', -40, 17, 500, 210],
          ['IT WORKS', 24, 58, 800, 280],
          ['OR YOU DON’T PAY', 60, 26, 700, 272],
        ].map(([txt, y, size, weight, len]) => {
          const e = S.svg('text', { x: 0, y, 'text-anchor': 'middle', 'font-family': weight === 500 ? 'IBM Plex Mono' : 'Archivo Variable', 'font-weight': weight, 'font-size': size, 'font-stretch': '125%', fill: ORANGE, textLength: len, lengthAdjust: 'spacingAndGlyphs' }, ink);
          e.textContent = txt;
          return e;
        });
        const stampTool = CAST.stamp(g4, { w: 300 });
        // (no lines to the left, where the list is)
        const slam = CAST.burst(g4, { color: ORANGE, r0: 200, r1: 280, n: 10, keep: (a) => a < 215 || a > 325 });
        const bot4 = CAST.robot(g4);
        const SLAM = 16.35;
        S.track((t) => {
          const inP = S.spring(t, 15.25, { freq: 1.6, damp: 0.6 });
          S.put(sheet, { x: 900, y: 760 + 500 * (1 - Math.min(1, inP)), r: -3 });
          itemTicks.forEach((tk, i) => S.draw(tk, ramp(t, 15.55 + i * 0.12, 0.2, E.out)));
          S.draw(sig, ramp(t, 15.9, 0.35, E.inOut));
          const down = ramp(t, SLAM - 0.3, 0.3, E.in);
          const up = ramp(t, SLAM + 0.2, 0.45, E.inOut);
          const sx = 1100, sy = 850; // where the imprint lands on the sheet
          // in from the top right and back out that way, clear of the headline
          const off = 1 - down + up;
          S.put(stampTool, { x: sx + 700 * off, y: sy - 900 * off, r: -8 - 10 * off, s: 1.2 });
          // (inside the sheet's edge, clear of the list above)
          S.put(ink, { x: 195, y: 100, r: -8, s: 0.9 * (1 + 0.08 * (1 - ramp(t, SLAM, 0.25, E.out))), o: t > SLAM ? 1 : 0 });
          slam.set(ramp(t, SLAM, 0.5, E.linear));
          S.put(slam.g, { x: sx, y: sy - 20 });
          const peek = S.spring(t, 16.75, { freq: 1.8, damp: 0.5 });
          bot4.set({
            x: 1780 - 190 * Math.min(1, peek), y: 520 + 8 * Math.sin(t * 2.6), s: 1.1, t, ground: 330, flame: 0.4, glow: 0.8,
            eyes: 'happy', look: [-0.8, 0.3], arm: [[20, -20], [-150 + 24 * Math.sin(t * 12), -30]], tilt: -8,
          });
        });
        headline(3, 'Fig. 3 · Our promise', 'Agreed in writing,<br /><em>before we build</em>.', 15.55, 99);

        K.endCard({
          at: 17.9,
          kicker: 'The Neurokov guarantee',
          big: 'It works, or<br />you <em>don’t pay</em>.',
          label: '150+ automations shipped · 50K+ hours handed back',
          cta: 'Start with a free audit →',
          size: 118,
        });
        K.wipes([
          [4.2, 'Your week →'],
          [8.8, 'With Neurokov →'],
          [15.2, 'Our promise →'],
        ]);
        K.note('Illustrated story', (t) => t >= 15.2 && t < 17.95);
        K.camera(
          [
            [0, [1000, 620, 1.12]],
            [4.2, [1000, 610, 1.17], E.sine],
            [4.21, [960, 640, 1.15], E.linear],
            [8.8, [960, 640, 1.2], E.sine],
            [8.81, [980, 640, 1.13], E.linear],
            [15.2, [980, 640, 1.18], E.sine],
            [15.21, [960, 660, 1.08], E.linear],
            [20, [960, 660, 1.14], E.sine],
          ],
          [
            [9.5, 0.4, 1],
            [SLAM, 0.45, 1.4],
          ],
        );
      });
    </script>
  </body>
</html>
