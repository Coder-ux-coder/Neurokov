<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 13s" />
    <meta name="poster" content="11.3" />
    <title>Outbound engine</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script>
      // Case 02, told as a story: an agency that lived on referrals (great
      // months, then quiet ones) burned a domain twice trying cold email. With
      // Neurokov, the calendar fills up: 46 qualified calls in the first 30
      // days. The result, not the machinery. Real numbers only (case 02).
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.4],
          [4.4, 8.4],
          [8.4, 13.0],
        ]);
        const { blinkAt, headline } = K;
        const BLUE = '#5b7fa6', GREEN = '#8aa37b';

        // ---------- Acts 1 and 3: the founders' office ----------
        const office = S.g(S.cam);
        // (up until the closing card's wipe has covered it: it never uncovers a bare stage)
        S.track((t) => (office.style.visibility = t < 4.4 || (t >= 8.4 && t < 11.7) ? '' : 'hidden'));
        K.room(office, { floor: 870, wall: '#ebe5d9', ground: '#ddd5c6' });
        CAST.dots(office, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });
        const cal = CAST.calendar(office, { w: 460, h: 400, cols: 7, rows: 5 });
        S.put(cal.g, { x: 1480, y: 470 });
        const month = S.svg('text', { x: 0, y: -200 + 38, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 24, 'letter-spacing': 3, fill: INK }, cal.g);
        // one chip per call, three to a cell at most
        const chips = cal.cells.map((c) =>
          [0, 1, 2].map((k) => S.svg('rect', { x: c.cx - c.cw / 2 + 11, y: c.cy - c.ch / 2 + 10 + k * 14, width: c.cw - 22, height: 10, rx: 5, fill: ORANGE, stroke: INK, 'stroke-width': 2.5 }, cal.g)),
        );
        const weekend = (i) => i % 7 >= 5;
        // act 1: a busy month, then a quiet one
        const busy = [0, 1, 3, 4, 7, 8, 9, 10, 11, 14, 16, 17, 18, 21, 22, 23, 25, 28, 29, 31, 32];
        // act 3: 30 days, two calls a working day and three on two of them: 46
        const calls = cal.cells.map((_, i) => (i >= 30 || weekend(i) ? 0 : i === 9 || i === 22 ? 3 : 2));
        const desk = CAST.desk(office, { w: 640, h: 190 });
        S.put(desk, { x: 780, y: 870 });
        const chairA = CAST.chair(office);
        S.put(chairA, { x: 510, y: 870 });
        const chairB = CAST.chair(office);
        S.put(chairB, { x: 1090, y: 870, sx: -1, sy: 1 });
        const founderA = CAST.person(office, { shirt: BLUE, hair: 'short' });
        const founderB = CAST.person(office, { shirt: GREEN, hair: 'bob', hairColor: '#6b4a2e' });
        const lap = CAST.laptop(office, { w: 220, h: 150 });
        S.put(lap.g, { x: 860, y: 680 });
        // a video call on the laptop, in act 3
        const call = S.g(lap.ui);
        S.svg('rect', { x: -98, y: -138, width: 196, height: 120, fill: '#cfe0f0' }, call);
        S.svg('circle', { cx: 0, cy: -84, r: 26, fill: PAPER, stroke: INK, 'stroke-width': 4 }, call);
        S.svg('path', { d: 'M -34 -18 C -34 -50 34 -50 34 -18 Z', fill: ORANGE, stroke: INK, 'stroke-width': 4 }, call);
        S.svg('path', { d: 'M -9 -78 Q 0 -70 9 -78', fill: 'none', stroke: INK, 'stroke-width': 3.5, 'stroke-linecap': 'round' }, call);
        const phone = CAST.deskphone(office);
        S.put(phone.g, { x: 670, y: 680 });
        const web = S.svg('path', { d: 'M -60 -40 L 4 18 M -60 -40 L -60 20 M -60 -40 L 30 -40 M -60 -14 Q -38 -16 -34 -40 M -60 6 Q -18 2 -10 -40', fill: 'none', stroke: INK, 'stroke-width': 2.5 }, office);
        S.put(web, { x: 670, y: 610 });
        const weed = CAST.tumbleweed(office, { r: 52 });
        const count3 = S.html('<div class="chip" style="left:1480px;top:700px;transform:translateX(-50%);font-size:26px"></div>', S.hudCam);
        S.track((t) => {
          const act3 = t >= 8.4;
          // the calendar: busy, a page turn, empty; then the first 30 days fill
          const flip = act3 ? 0 : env(t, 2.05, 2.35, 0.15);
          const quiet = !act3 && t > 2.2;
          const day = act3 ? Math.floor(30 * ramp(t, 8.75, 1.8, E.linear)) : 0;
          month.textContent = act3 ? `DAY ${String(Math.max(1, day)).padStart(2, '0')} OF 30` : quiet ? 'APRIL' : 'MARCH';
          let booked = 0;
          cal.cells.forEach((c, i) => {
            let fill = weekend(i) ? '#d6cebf' : SHADE;
            if (!act3 && !quiet && busy.includes(i) && t > 0.3 + busy.indexOf(i) * 0.07) fill = '#ffc8a8';
            if (act3 && i < day) fill = '#fff3ea';
            c.cell.setAttribute('fill', fill);
            chips[i].forEach((ch, k) => {
              const on = act3 ? i < day && k < calls[i] : !quiet && busy.includes(i) && k < 2 - (i % 2) && t > 0.35 + busy.indexOf(i) * 0.07;
              if (act3 && on) booked++;
              ch.style.visibility = on ? '' : 'hidden';
            });
          });
          S.put(cal.g, { x: 1480, y: 470, sy: 1 - 0.9 * flip, sx: 1 });
          count3.style.visibility = act3 ? '' : 'hidden';
          count3.innerHTML = `Calls booked · <b>${String(booked).padStart(2, '0')}</b>`;
          count3.style.transform = `translateX(-50%) scale(${(1 + 0.08 * hit(t, 10.55, 0.3)).toFixed(3)})`;
          // the phone rings in the good months, gathers dust in the quiet one
          phone.ring(t, (t < 1.9 && Math.sin(t * 5) > -0.3) || (act3 && t > 8.7 && Math.sin(t * 5) > -0.3) ? 1 : 0);
          S.put(web, { x: 670, y: 612, s: Math.max(0.001, ramp(t, 3.0, 0.6, E.out)), o: quiet && t > 3.0 ? 1 : 0 });
          // a tumbleweed rolls through the quiet month
          const wx = 2000 - 2300 * ramp(t, 2.45, 1.9, E.linear);
          S.put(weed.g, { x: wx, y: 870 - 52 - 34 * Math.abs(Math.sin(t * 6.2)), o: quiet && wx < 1990 && wx > -300 ? 1 : 0 });
          S.put(weed.ball, { r: -((2000 - wx) / 52) * 57.3 });
          // the founders
          const happy = !quiet;
          const watch = quiet ? S.clamp((wx - 780) / 700, -1, 1) : 0;
          const pump = act3 ? env(t, 9.1, 11.1, 0.2) * Math.abs(Math.sin(t * 7)) : t < 2 ? 0.6 * Math.abs(Math.sin(t * 6)) : 0;
          const drum = quiet ? Math.sin(t * 30) * 6 : 0;
          founderA.set({
            x: 580, y: 870, seated: 120, leg: [[70, -70], [76, -74]], bob: happy ? 4 * Math.abs(Math.sin(t * 6)) : 0,
            arm: [[40, 60], happy ? [150 - 40 * pump, 20 + 30 * pump] : [62, 40 + drum]], lean: quiet ? 8 : 0,
            mouth: happy ? 'grin' : t > 3.4 ? 'frown' : 'flat', look: quiet ? [watch, 0.3] : [0.6, -0.4],
            blink: blinkAt(t, [1.4, 3.9, 9.7]),
          });
          const talking = act3 ? K.talk(t, 8.8, 11.1) : 'grin';
          founderB.set({
            x: 1040, y: 870, flip: -1, seated: 120, leg: [[70, -70], [76, -74]], bob: happy ? 4 * Math.abs(Math.sin(t * 6 + 1)) : 0,
            arm: [[40, 60], [55, 50]], lean: quiet ? 8 : 0, headTilt: quiet ? 6 : 0,
            mouth: act3 ? talking : happy ? 'grin' : 'flat', look: act3 ? [1, 0.3] : quiet ? [-watch, 0.3] : [0.2, -0.6],
            blink: blinkAt(t, [0.9, 3.3, 10.1]),
          });
          call.style.visibility = act3 ? '' : 'hidden';
        });
        headline(0, 'Fig. 1 · Referrals only', 'Great months,<br />then <em>quiet ones</em>.', 0.45, 4.0, { dark: false });
        headline(2, 'Fig. 3 · With Neurokov', 'Now the calendar<br /><em>fills up</em>.', 8.8, 99, { dark: false });

        // ---------- Act 2: cold email, burned twice ----------
        const g2 = K.act(1);
        S.svg('rect', { x: -600, y: -600, width: 3200, height: 2400, fill: PAPER }, g2);
        K.paper(g2);
        const boxes = [
          [1180, 'domain 1', 5.55],
          [1540, 'domain 2', 7.3],
        ].map(([x, label, burn]) => {
          const m = CAST.mailbox(g2, { label });
          const fire = CAST.fire(g2, { w: 120 });
          const smoke = [0, 1, 2].map(() => S.svg('circle', { r: 26, fill: '#9a948a', stroke: INK, 'stroke-width': 3 }, g2));
          return { m, fire, smoke, x, burn };
        });
        const cannon = CAST.cannon(g2);
        const guy = CAST.person(g2, { shirt: GRAY, hair: 'short', hairColor: '#8a6a44' });
        const shots = [...[0, 1, 2, 3, 4].map((i) => [4.75 + i * 0.17, 0]), ...[0, 1, 2, 3, 4].map((i) => [6.5 + i * 0.17, 1])];
        const flash = CAST.burst(g2, { color: ORANGE, r0: 30, r1: 70, n: 7 });
        const aimAt = (t) => S.kf(t, [[4.4, -20], [6.1, -20], [6.4, -14, E.back]]);
        const ammo = shots.map(([at, k]) => {
          const e = CAST.envelope(g2, { w: 84, h: 56, seal: GRAY });
          S.track((t) => {
            const p = ramp(t, at, 0.42, E.linear);
            const aim = aimAt(at);
            const [mx, my] = cannon.muzzle(aim);
            const x0 = 540 + mx * 1.15, y0 = 870 + my * 1.15;
            const x1 = boxes[k].x - 20, y1 = 870 - 175 * 1.3;
            S.put(e.g, { x: x0 + (x1 - x0) * p, y: y0 + (y1 - y0) * p - 150 * Math.sin(Math.PI * p), r: 540 * p, s: 0.8 * K.pop(t, at, at + 0.42, 0.12), o: t > at && p < 1 ? 1 : 0 });
          });
          return e;
        });
        S.track((t) => {
          const aim = aimAt(t);
          const recoil = shots.reduce((m, [at]) => Math.max(m, 26 * S.hit(t, at, 0.2)), 0);
          cannon.set({ aim, recoil });
          S.put(cannon.g, { x: 540, y: 870, s: 1.15 });
          const last = shots.filter(([at]) => t >= at).pop();
          if (last) {
            const [mx, my] = cannon.muzzle(aim);
            S.put(flash.g, { x: 540 + mx * 1.15 + 10, y: 870 + my * 1.15 });
            flash.set(ramp(t, last[0], 0.25, E.linear));
          } else flash.set(0);
          guy.set({
            x: 330, y: 870, arm: [[20, -10], [60 + 10 * Math.sin(t * 3), 40]], mouth: t > 7.35 ? 'o' : t > 5.6 && t < 6.4 ? 'o' : 'grin',
            look: [1, -0.2], blink: blinkAt(t, [5.1, 7.9]), headTilt: -4,
          });
          boxes.forEach(({ m, fire, smoke, x, burn }, k) => {
            const hits = shots.filter(([at, kk]) => kk === k).reduce((s2, [at]) => s2 + S.hit(t, at + 0.42, 0.25), 0);
            S.put(m.g, { x, y: 870, s: 1.3 });
            S.put(m.box, { r: 6 * hits * Math.sin(t * 40) });
            m.setFlag(ramp(t, burn - 0.4, 0.2, E.back));
            const p = ramp(t, burn, 0.45, E.out);
            S.put(fire.g, { x, y: 870 - 196 * 1.3 + 6, s: 1.2 });
            fire.set(t, p);
            smoke.forEach((sm, i) => {
              const u = ((t - burn) * 0.7 + i / 3) % 1;
              S.put(sm, { x: x - 20 + 40 * S.noise(i + 9, t) + 30 * u, y: 560 - 170 * u, s: 0.5 + 0.7 * u, o: t > burn + 0.3 ? 0.45 * Math.sin(Math.PI * u) : 0 });
            });
          });
        });
        K.stamp('Burned', { x: 1225, y: 770, at: 5.9, until: 8.4, rot: -10, size: 44 });
        K.stamp('Burned', { x: 1655, y: 770, at: 7.65, until: 8.4, rot: 7, size: 44 });
        headline(1, 'Fig. 2 · They tried cold email', 'It burned a domain.<br /><em>Twice.</em>', 4.85, 8.0, { dark: false });

        // ---------- The close ----------
        K.endCard({
          at: 11.1,
          kicker: 'Case 02 · Outbound engine · B2B growth agency, 25 people',
          big: '<b data-n>0</b> qualified calls',
          count: [0, 46],
          label: 'In the first 30 days · Zero sales hires · Main domain untouched',
        });
        K.wipes([
          [4.4, 'Then they tried cold email →'],
          [8.4, 'With Neurokov · The first 30 days →'],
        ]);
        K.note('Illustrated story · Real numbers from case 02', () => false);
        K.camera(
          [
            [0, [960, 640, 1.2]],
            [4.4, [960, 640, 1.26], E.sine],
            [4.41, [960, 640, 1.15], E.linear],
            [8.4, [980, 640, 1.2], E.sine],
            [8.41, [960, 640, 1.15], E.linear],
            [13, [960, 640, 1.2], E.sine],
          ],
          [
            [5.55, 0.35, 0.6],
            [7.3, 0.35, 0.8],
          ],
        );
      });
    </script>
  </body>
</html>
