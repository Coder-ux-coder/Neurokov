<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 20s" />
    <meta name="poster" content="16.2" />
    <title>Marketing automation</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script src="board.js"></script>
    <script>
      // Marketing automation, as a board game (services.ts: "One idea, a week of
      // content"). Act 1: a blank page, a line typed and deleted, and the week on
      // the wall crossed off day by day with nothing posted. Act 2: NK-01 hops
      // through the five steps, and the same week fills up. Illustrated; no numbers.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.6],
          [4.6, 17.0],
          [17.0, 20.1],
        ]);
        const { blinkAt, headline } = K;

        // A week planner, centred: an orange header and five day slots.
        const week = (parent, { w, h, title = 'THIS WEEK' }) => {
          const g = S.g(parent);
          const head = Math.round(h * 0.24);
          S.svg('rect', { x: -w / 2 + 10, y: -h / 2 + 12, width: w, height: h, rx: 16, fill: INK }, g);
          S.svg('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 16, fill: PAPER, stroke: INK, 'stroke-width': 5 }, g);
          S.svg('path', { d: `M ${-w / 2} ${-h / 2 + head} L ${-w / 2} ${-h / 2 + 16} Q ${-w / 2} ${-h / 2} ${-w / 2 + 16} ${-h / 2} L ${w / 2 - 16} ${-h / 2} Q ${w / 2} ${-h / 2} ${w / 2} ${-h / 2 + 16} L ${w / 2} ${-h / 2 + head} Z`, fill: ORANGE, stroke: INK, 'stroke-width': 5 }, g);
          const tt = S.svg('text', { x: 0, y: -h / 2 + head * 0.68, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': Math.round(head * 0.42), 'letter-spacing': 3, fill: INK }, g);
          tt.textContent = title;
          const cw = (w - 40) / 5;
          const slots = ['M', 'T', 'W', 'T', 'F'].map((d, i) => {
            const cx = -w / 2 + 20 + cw * (i + 0.5);
            const lab = S.svg('text', { x: cx, y: -h / 2 + head + Math.round(h * 0.13), 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': Math.round(h * 0.09), fill: INK }, g);
            lab.textContent = d;
            const top = -h / 2 + head + Math.round(h * 0.17), bot = h / 2 - 14;
            const slot = S.svg('rect', { x: cx - cw / 2 + 6, y: top, width: cw - 12, height: bot - top, rx: 8, fill: SHADE }, g);
            return { cx, cy: (top + bot) / 2, sw: cw - 12, sh: bot - top, slot };
          });
          return { g, slots };
        };

        // ---------- Act 1: another week, nothing posted ----------
        const g1 = K.act(0);
        K.room(g1, { floor: 870, wall: '#e9e2d4', ground: '#ddd5c6' });
        CAST.dots(g1, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });
        S.put(CAST.plant(g1), { x: 1690, y: 870, s: 1.05 });

        // the week on the wall, crossed off day by day
        const plan = week(g1, { w: 440, h: 240 });
        S.put(plan.g, { x: 1480, y: 350 });
        const crosses = plan.slots.map(({ cx, cy, sw }) => {
          const k = sw * 0.34;
          const a = S.svg('path', { d: `M ${cx - k} ${cy - k * 1.25} L ${cx + k} ${cy + k * 1.25}`, stroke: INK, 'stroke-width': 8, 'stroke-linecap': 'round', opacity: 0.85 }, plan.g);
          const b = S.svg('path', { d: `M ${cx + k} ${cy - k * 1.25} L ${cx - k} ${cy + k * 1.25}`, stroke: INK, 'stroke-width': 8, 'stroke-linecap': 'round', opacity: 0.85 }, plan.g);
          return [a, b];
        });
        S.track((t) => {
          crosses.forEach(([a, b], i) => {
            const at = 0.6 + i * 0.7;
            S.draw(a, ramp(t, at, 0.12, E.linear));
            S.draw(b, ramp(t, at + 0.12, 0.12, E.linear));
          });
        });

        // the desk: a blank page, a line typed and deleted, twice
        const desk = CAST.desk(g1, { w: 540, h: 190 });
        S.put(desk, { x: 940, y: 870 });
        const chair = CAST.chair(g1);
        S.put(chair, { x: 600, y: 870 });
        const mug = CAST.mug(g1);
        S.put(mug.g, { x: 1150, y: 680 });
        const lap = CAST.laptop(g1, { w: 300, h: 190 });
        S.put(lap.g, { x: 920, y: 680 });
        S.svg('rect', { x: -120, y: -160, width: 90, height: 12, rx: 6, fill: GRAY }, lap.ui);
        const line = S.svg('rect', { x: -120, y: -126, height: 10, rx: 5, fill: INK, opacity: 0.8 }, lap.ui);
        const caret = S.svg('rect', { y: -132, width: 4, height: 22, fill: ORANGE }, lap.ui);
        const TYPED = [
          [0, 0],
          [0.25, 0],
          [1.1, 170],
          [1.25, 170],
          [1.55, 0, E.linear],
          [1.7, 0],
          [2.35, 120],
          [2.5, 120],
          [2.7, 0, E.linear],
        ];
        S.track((t) => {
          const w = S.kf(t, TYPED);
          line.setAttribute('width', Math.max(0.01, w).toFixed(1));
          line.style.visibility = w > 1 ? '' : 'hidden';
          S.put(caret, { x: -120 + w + 3, o: t % 0.7 < 0.4 || (t > 0.25 && t < 2.7 && Math.abs(S.kf(t + 0.05, TYPED) - w) > 0.5) ? 1 : 0 });
          mug.set(t);
        });

        // the marketer: types, deletes, scratches their head, gives up
        const writer = CAST.person(g1, { shirt: '#ffd166', hair: 'short', hairColor: '#3a2a1e', glasses: true });
        const mix = (a, b, k) => a.map((p, i) => p.map((v, j) => v + (b[i][j] - v) * k));
        S.track((t) => {
          const typing = (t > 0.25 && t < 1.1) || (t > 1.7 && t < 2.35) ? 1 : 0;
          const tap = Math.sin(t * 32) * 6 * typing;
          const scratch = env(t, 2.75, 3.3, 0.15);
          const slump = ramp(t, 3.4, 0.4);
          const TYPE = [[64, 40 + tap], [70, 34 - tap]];
          const SCRATCH = [[64, 40], [150, 120 + 12 * Math.sin(t * 22)]];
          const HOLD = [[80, 129], [80, 129]];
          writer.set({
            x: 650, y: 870, seated: 120, leg: [[70, -70], [76, -74]],
            lean: 6 + 14 * slump, headTilt: 6 * scratch + 4 * slump,
            arm: mix(mix(TYPE, SCRATCH, scratch), HOLD, slump),
            mouth: t < 1.25 ? 'smile' : t < 2.5 ? 'flat' : 'frown',
            look: [1, 0.3], blink: blinkAt(t, [0.9, 2.1, 3.0]),
          });
        });
        headline(0, 'Fig. 1 · Sound familiar?', 'Another week,<br /><em>nothing posted</em>.', 0.35, 4.25, { dark: false });

        // ---------- Act 2: the content workflow, square by square ----------
        const g2 = K.act(1);
        S.svg('rect', { x: -1400, y: -900, width: 6400, height: 2800, fill: PAPER }, g2);
        CAST.dots(g2, { x0: -1400, y0: -900, w: 6400, h: 1770, o: 0.1 });
        CAST.ground(g2, { x0: -1400, x1: 5000 }).setAttribute('transform', 'translate(0 870)');

        const record = (p) => {
          const ph = CAST.phone(p, { w: 112, h: 196 });
          S.put(ph.g, { x: -58, y: 2 });
          const wv = CAST.wave(ph.ui, { n: 6, w: 76, h: 64 });
          S.put(wv.g, { y: -30 });
          const dot = S.svg('circle', { r: 20, fill: ORANGE, stroke: INK, 'stroke-width': 4 }, ph.ui);
          const bar = S.svg('rect', { x: -38, y: 68, height: 6, rx: 3, fill: ORANGE }, ph.ui);
          S.svg('rect', { x: -38, y: 68, width: 76, height: 6, rx: 3, fill: 'none', stroke: INK, 'stroke-width': 2 }, ph.ui);
          const arcs = [0, 1, 2].map((i) => S.svg('path', { d: `M ${34 + i * 26} -44 Q ${56 + i * 32} 2 ${34 + i * 26} 48`, fill: 'none', stroke: INK, 'stroke-width': 6, 'stroke-linecap': 'round' }, p));
          return {
            set(u) {
              wv.set(u, u > 0.1 ? 1 : 0.25);
              S.put(dot, { y: 34, s: 1 + 0.12 * Math.sin(u * 8) });
              bar.setAttribute('width', (76 * ramp(u, 0.1, 1.6, E.linear)).toFixed(1));
              arcs.forEach((a, i) => a.setAttribute('opacity', u > 0.1 ? (0.25 + 0.75 * S.wave(u, 0.9, i * 0.22)).toFixed(2) : 0));
            },
          };
        };
        const outline = (p) => {
          const wv = CAST.wave(p, { n: 5, w: 64, h: 50 });
          S.put(wv.g, { x: -120, y: -6 });
          S.svg('path', { d: 'M -78 -6 L -46 -6 M -58 -18 L -46 -6 L -58 6', fill: 'none', stroke: INK, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
          S.svg('rect', { x: -26 + 8, y: -86 + 10, width: 172, height: 172, rx: 12, fill: INK }, p);
          S.svg('rect', { x: -26, y: -86, width: 172, height: 172, rx: 12, fill: PAPER, stroke: INK, 'stroke-width': 4 }, p);
          const items = [-48, -2, 44].map((y) => ({
            dot: S.svg('circle', { cx: -6, cy: y, r: 7, fill: ORANGE, stroke: INK, 'stroke-width': 2.5 }, p),
            a: S.svg('rect', { x: 10, y: y - 5, height: 9, rx: 4.5, fill: INK, opacity: 0.8 }, p),
            b: S.svg('rect', { x: 10, y: y + 10, height: 7, rx: 3.5, fill: INK, opacity: 0.4 }, p),
          }));
          const sp = CAST.sparkle(p, { r: 16 });
          return {
            set(u) {
              wv.set(u, 1 - 0.7 * ramp(u, 1.0, 0.4));
              items.forEach(({ dot, a, b }, i) => {
                const at = 0.2 + i * 0.28;
                dot.style.visibility = u > at ? '' : 'hidden';
                a.setAttribute('width', Math.max(0.01, 110 * ramp(u, at, 0.25, E.out)).toFixed(1));
                b.setAttribute('width', Math.max(0.01, 74 * ramp(u, at + 0.1, 0.25, E.out)).toFixed(1));
                a.style.visibility = b.style.visibility = u > at ? '' : 'hidden';
              });
              S.put(sp, { x: 146, y: -86, s: Math.max(0.001, Math.min(1, (u - 1.0) * 4)), r: 20 * u, o: u > 1.0 ? 1 : 0 });
            },
          };
        };
        const post = (parent, fill) => {
          const g = S.g(parent);
          S.svg('rect', { x: -62 + 6, y: -80 + 8, width: 124, height: 160, rx: 12, fill: INK }, g);
          S.svg('rect', { x: -62, y: -80, width: 124, height: 160, rx: 12, fill: PAPER, stroke: INK, 'stroke-width': 4 }, g);
          S.svg('circle', { cx: -40, cy: -56, r: 10, fill: ORANGE, stroke: INK, 'stroke-width': 3 }, g);
          S.svg('rect', { x: -24, y: -60, width: 56, height: 8, rx: 4, fill: INK, opacity: 0.8 }, g);
          S.svg('rect', { x: -48, y: -34, width: 96, height: 56, rx: 8, fill, stroke: INK, 'stroke-width': 3 }, g);
          S.svg('rect', { x: -48, y: 34, width: 96, height: 7, rx: 3.5, fill: INK, opacity: 0.7 }, g);
          S.svg('rect', { x: -48, y: 50, width: 62, height: 7, rx: 3.5, fill: INK, opacity: 0.7 }, g);
          return g;
        };
        const drafts = (p) => {
          const cards = [
            ['#ffd166', -84, -9],
            ['#8aa37b', 84, 9],
            [ORANGE, 0, 0],
          ].map(([fill, x, r]) => ({ g: post(p, fill), x, r }));
          const sp = CAST.sparkle(p, { r: 17 });
          return {
            set(u) {
              cards.forEach(({ g, x, r }, i) => {
                const a = 0.12 + i * 0.28;
                const k = Math.min(1.12, S.spring(u, a, { freq: 2.6, damp: 0.45 }));
                S.put(g, { x: x * Math.min(1, k), y: 8 + 30 * (1 - Math.min(1, k)), r: r * Math.min(1, k), s: Math.max(0.001, k), o: u > a ? 1 : 0 });
              });
              S.put(sp, { x: 128, y: -92, s: Math.max(0.001, Math.min(1, (u - 0.9) * 4)), r: 20 * u, o: u > 0.9 ? 1 : 0 });
            },
          };
        };
        const review = (p) => {
          const rows = [ORANGE, '#ffd166', '#8aa37b'].map((fill, i) => {
            const y = -66 + i * 66;
            S.svg('rect', { x: -134 + 6, y: y - 26 + 7, width: 220, height: 52, rx: 10, fill: INK }, p);
            S.svg('rect', { x: -134, y: y - 26, width: 220, height: 52, rx: 10, fill: PAPER, stroke: INK, 'stroke-width': 3.5 }, p);
            S.svg('rect', { x: -124, y: y - 17, width: 44, height: 34, rx: 6, fill, stroke: INK, 'stroke-width': 3 }, p);
            S.svg('rect', { x: -68, y: y - 10, width: 120, height: 7, rx: 3.5, fill: INK, opacity: 0.75 }, p);
            S.svg('rect', { x: -68, y: y + 4, width: 80, height: 7, rx: 3.5, fill: INK, opacity: 0.4 }, p);
            const ck = CAST.check(p, { r: 20 });
            return { ck, y };
          });
          return {
            set(u) {
              rows.forEach(({ ck, y }, i) => {
                const a = 0.25 + i * 0.3;
                const k = Math.min(1.15, S.spring(u, a, { freq: 2.8, damp: 0.4 }));
                S.put(ck.g, { x: 122, y, s: Math.max(0.001, k), o: u > a ? 1 : 0 });
                ck.set(ramp(u, a + 0.08, 0.25, E.out));
              });
            },
          };
        };
        const scheduled = (p) => {
          const wk = week(p, { w: 284, h: 190 });
          S.put(wk.g, { x: -8, y: 6 });
          const blocks = wk.slots.map(({ cx, cy, sw, sh }, i) => {
            const b = S.g(wk.g);
            S.svg('rect', { x: -sw / 2 + 4, y: -sh / 2 + 6, width: sw - 8, height: sh - 12, rx: 6, fill: [ORANGE, '#ffd166', ORANGE, '#8aa37b', ORANGE][i], stroke: INK, 'stroke-width': 3 }, b);
            S.svg('rect', { x: -sw / 2 + 10, y: sh / 2 - 22, width: sw - 20, height: 5, rx: 2.5, fill: INK, opacity: 0.7 }, b);
            return { b, cx, cy };
          });
          return {
            set(u) {
              blocks.forEach(({ b, cx, cy }, i) => {
                const a = 0.1 + i * 0.17;
                const k = Math.min(1.12, S.spring(u, a, { freq: 2.8, damp: 0.42 }));
                S.put(b, { x: cx, y: cy - 30 * (1 - Math.min(1, k)), s: Math.max(0.001, k), o: u > a ? 1 : 0 });
              });
            },
          };
        };

        const board = BOARD(K, g2, {
          steps: ['Record a 10-minute voice note', 'Transcribed and outlined', 'Drafts posts in your voice', 'You review and approve', 'Scheduled across channels'],
          cards: [record, outline, drafts, review, scheduled],
          land: 6.3,
          per: 1.95,
          blink: [7.4, 9.9, 13.3],
        });
        headline(1, 'Fig. 2 · With Neurokov', 'Ten minutes of talking,<br /><em>a week of posts</em>.', 4.95, 6.05, { dark: false });
        headline(1, 'Fig. 3 · The whole workflow', 'One idea in,<br /><em>a week out</em>.', board.last + 1.1, 99, { dark: false });

        // ---------- Act 3 ----------
        K.endCard({
          at: 17.0,
          kicker: 'Marketing automation · Content workflow',
          big: 'A week of content,<br /><em>from one idea</em>.',
          label: 'You approve · The system publishes',
          cta: 'Book a free audit →',
          size: 112,
        });
        K.wipes([[4.6, 'With Neurokov →']]);
        K.note('Illustrated story · A typical content workflow', () => false);
        K.camera(
          [
            [0, [960, 600, 1.08]],
            [4.6, [960, 600, 1.14], E.sine],
            [4.61, board.keys[0][1], E.linear],
            ...board.keys,
            [20, [board.mid, 600, board.wide * 1.03], E.linear],
          ],
          [[board.lands[0], 0.3, 0.6]],
        );
      });
    </script>
  </body>
</html>
