<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 20s" />
    <meta name="poster" content="16.2" />
    <title>Workflow automation</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script src="board.js"></script>
    <script>
      // Workflow automation, as a board game (services.ts: "Client onboarding, on
      // autopilot"). Act 1: onboarding a new client means a week of emails,
      // folders and reminders. Act 2: NK-01 hops through the system's five
      // steps. Illustrated; no numbers.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.6],
          [4.6, 17.0],
          [17.0, 20.1],
        ]);
        const { blinkAt, headline } = K;

        // ---------- Act 1: a week of emails for every new client ----------
        const g1 = K.act(0);
        K.room(g1, { floor: 870, wall: '#ece6dc', ground: '#ddd5c7' });
        CAST.dots(g1, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });

        // the working week goes by on the wall
        const pad = CAST.pad(g1, { w: 210, h: 240, label: 'DAY' });
        S.put(pad.g, { x: 1570, y: 272 });
        const DAY = [0, 0.95, 1.7, 2.45, 3.2];
        S.track((t) => {
          let d = 0;
          while (d < DAY.length - 1 && t >= DAY[d + 1]) d++;
          pad.setDay(String(d + 1));
          pad.flyText(String(d));
          // the old page tears off whole, like paper, uncovering the new day as it
          // goes; it fades only once its number is clear of the new one. It goes off
          // to the left, into the bare wall by the headline: dropping, it fell behind
          // the notes under the pad, and the frame's edge leaves no room right or above.
          const fly = d > 0 ? ramp(t, DAY[d], 0.35, E.linear) : 1;
          S.put(pad.flyer, { x: -220 * (1 - (1 - fly) ** 2), y: -20 * fly * fly, r: 10 * fly, o: fly < 1 ? 1 - ramp(fly, 0.7, 0.3, E.linear) : 0 });
        });

        // reminders pile up on the wall
        [
          ['Send\ncontract', 1330, 480, -6, 1.1, '#ffd166'],
          ['Make\nfolders', 1545, 530, 5, 1.8, '#ffb38a'],
          ['Book\nkickoff', 1735, 470, -4, 2.5, '#ffd166'],
          ['Welcome\npack', 1440, 660, 7, 3.15, '#ffb38a'],
        ].forEach(([text, x, y, r, at, fill]) => {
          const n = CAST.sticky(g1, { text, w: 124, size: 20, fill });
          n.set(0);
          S.track((t) => {
            const p = Math.min(1.12, S.spring(t, at, { freq: 2.6, damp: 0.4 }));
            S.put(n.g, { x, y, r: r + 6 * hit(t, at, 0.4), s: Math.max(0.001, p), o: t > at ? 1 : 0 });
          });
        });

        // folders stack up on the floor
        const FOLDERS = 11;
        const folderFill = [ORANGE, '#ffd166', SHADE, '#8aa37b'];
        for (let i = 0; i < FOLDERS; i++) {
          const f = CAST.folder(g1, { w: 150, h: 24, fill: folderFill[i % 4] });
          const at = 0.9 + i * 0.3;
          const jx = ((i * 37) % 26) - 13;
          S.track((t) => {
            // tossed in from the right, clear of the calendar
            const p = ramp(t, at, 0.32, E.out);
            S.put(f, { x: 1690 + jx + 420 * (1 - p), y: 856 - i * 22 - 160 * Math.sin(Math.PI * p) * (1 - p), r: ((i * 23) % 10) - 5 + 90 * (1 - p), o: t > at ? 1 : 0 });
          });
        }

        // the laptop on the desk keeps sending mail
        const desk = CAST.desk(g1, { w: 440, h: 190 });
        S.put(desk, { x: 560, y: 870 });
        const lap = CAST.laptop(g1, { w: 280, h: 180 });
        S.put(lap.g, { x: 540, y: 680 });
        [0, 1, 2].forEach((i) => {
          S.svg('rect', { x: -112, y: -150 + i * 34, width: 224, height: 26, rx: 6, fill: i === 0 ? '#ffe2cf' : SHADE, stroke: INK, 'stroke-width': 2.5 }, lap.ui);
          S.svg('rect', { x: -100, y: -141 + i * 34, width: 80 + 30 * (i % 2), height: 8, rx: 4, fill: INK }, lap.ui);
        });
        // (on the laptop's far corner from the mail's arc: on the near one, every
        // letter flew across its count)
        const badge = CAST.badge(g1, { r: 28 });
        S.put(badge.g, { x: 410, y: 510 });
        const MAIL = 10;
        const mailAt = (i) => 0.55 + i * 0.36;
        S.track((t) => {
          const n = Array.from({ length: MAIL }, (_, i) => i).filter((i) => t > mailAt(i) + 0.55).length;
          badge.set(String(3 + n));
          S.put(badge.g, { x: 410, y: 510, s: 1 + 0.25 * hit(t, mailAt(Math.max(0, n - 1)) + 0.55, 0.25) });
        });
        for (let i = 0; i < MAIL; i++) {
          const e = CAST.envelope(g1, { w: 84, h: 56 });
          const at = mailAt(i);
          const rest = [860 + ((i * 41) % 60) - 30, 842 - i * 12, ((i * 53) % 30) - 15];
          S.track((t) => {
            const p = ramp(t, at, 0.55, E.inOut);
            const x = 560 + (rest[0] - 560) * p;
            const y = 600 + (rest[1] - 600) * p - 220 * Math.sin(Math.PI * p);
            // (it grows out of the laptop without overshooting: any bigger at the top of its arc
            // and its corner would graze the headline's "new")
            S.put(e.g, { x, y, r: rest[2] * p + 360 * (1 - p), s: (0.7 + 0.3 * p) * Math.min(1, K.pop(t, at)), o: t > at ? 1 : 0 });
          });
        }

        // and whoever handles onboarding runs out of hands
        const ops = CAST.person(g1, { shirt: '#5b7fa6', hair: 'short', hairColor: '#3a2a1e' });
        const sweats = [0, 1, 2].map(() => CAST.sweat(g1));
        S.track((t) => {
          const panic = ramp(t, 2.5, 0.4);
          const shake = Math.sin(t * 30) * 10 * panic;
          const glance = S.kf(t, [
            [0, [1, 0.2]],
            [1.0, [1, 0.2]],
            [1.25, [-1, -0.8]],
            [1.9, [-1, -0.6]],
            [2.1, [1, 0.4]],
            [2.5, [-1, -0.2]],
          ]);
          ops.set({
            x: 1090, y: 870, flip: -1, lean: -6 * panic, headTilt: 6 * Math.sin(t * 5) * panic,
            headTurn: glance[0] < 0 ? -1 : 0,
            arm: panic > 0 ? [[150 + shake, 30], [150 - shake, 30]] : [[10, -10], [30, 60]],
            mouth: t < 1.1 ? 'smile' : t < 2.5 ? 'o' : 'frown',
            look: glance, blink: blinkAt(t, [0.8, 2.2]),
          });
          [2.7, 3.2, 3.7].forEach((a, i) => {
            S.put(sweats[i].g, { x: 1090 - 40 * (i % 2 ? -1 : 1), y: 870 - 330 });
            sweats[i].set(ramp(t, a, 0.6, E.linear));
          });
        });
        headline(0, 'Fig. 1 · Sound familiar?', 'A week of emails<br />for every <em>new client</em>.', 0.35, 4.25, { dark: false });

        // ---------- Act 2: the onboarding system, square by square ----------
        const g2 = K.act(1);
        S.svg('rect', { x: -1400, y: -900, width: 6400, height: 2800, fill: PAPER }, g2);
        CAST.dots(g2, { x0: -1400, y0: -900, w: 6400, h: 1770, o: 0.1 });
        CAST.ground(g2, { x0: -1400, x1: 5000 }).setAttribute('transform', 'translate(0 870)');

        const contract = (p) => {
          const d = CAST.doc(p, { w: 150, h: 200, lines: 3 });
          S.put(d.g, { x: -40, y: 0, r: -4 });
          const sig = S.svg('path', { d: 'M -104 78 C -94 58 -82 94 -66 74 C -56 62 -48 88 -32 78 C -22 72 -14 82 0 74', fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, p);
          const st = S.g(p);
          S.svg('rect', { x: -72, y: -26, width: 144, height: 52, rx: 8, fill: PAPER, 'fill-opacity': 0.6, stroke: ORANGE, 'stroke-width': 6 }, st);
          const tx = S.svg('text', { x: 0, y: 10, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 27, 'letter-spacing': 3, fill: ORANGE }, st);
          tx.textContent = 'SIGNED';
          return {
            set(u) {
              S.draw(sig, ramp(u, 0.25, 0.55, E.inOut));
              const k = S.spring(u, 0.95, { freq: 3, damp: 0.4 });
              S.put(st, { x: 66, y: 12, r: -12, s: Math.max(0.001, 2 - Math.min(1.1, k)), o: u > 0.95 ? 1 : 0 });
            },
          };
        };
        const folders = (p) => {
          const fs = [
            [-80, 20, ORANGE, -8],
            [0, -10, '#ffd166', 0],
            [80, 20, SHADE, 8],
          ].map(([x, y, fill, r]) => ({ f: CAST.folder(p, { w: 110, h: 84, fill }), x, y, r }));
          const sp = CAST.sparkle(p, { r: 18 });
          return {
            set(u) {
              fs.forEach(({ f, x, y, r }, i) => {
                const a = 0.15 + i * 0.22;
                const k = Math.min(1.12, S.spring(u, a, { freq: 2.6, damp: 0.45 }));
                S.put(f, { x, y: y + 30 * (1 - Math.min(1, k)), r, s: Math.max(0.001, k), o: u > a ? 1 : 0 });
              });
              const sk = S.spring(u, 0.9, { freq: 2.4, damp: 0.4 });
              S.put(sp, { x: 112, y: -74, r: 20 * u, s: Math.max(0.001, Math.min(1.2, sk)), o: u > 0.9 ? 1 : 0 });
            },
          };
        };
        const welcome = (p) => {
          const d = CAST.doc(p, { w: 170, h: 200, lines: 6 });
          S.put(d.g, { x: -14, y: 0, r: 3 });
          const sp = CAST.sparkle(p, { r: 22 });
          const sp2 = CAST.sparkle(p, { r: 13, fill: '#ffd166' });
          return {
            set(u) {
              d.set(ramp(u, 0.2, 1.2, E.linear));
              const pulse = 1 + 0.12 * Math.sin(u * 8);
              S.put(sp, { x: 94, y: -76, s: Math.max(0.001, Math.min(1, u * 3)) * pulse, r: 15 * Math.sin(u * 3), o: u > 0 ? 1 : 0 });
              S.put(sp2, { x: 118, y: -36, s: Math.max(0.001, Math.min(1, (u - 0.2) * 3)) * (2 - pulse), o: u > 0.2 ? 1 : 0 });
            },
          };
        };
        const kickoff = (p) => {
          const cal = CAST.calendar(p, { w: 230, h: 180, cols: 5, rows: 2 });
          S.put(cal.g, { x: -10, y: 6 });
          const target = cal.cells[7];
          const ck = CAST.check(p, { r: 24 });
          return {
            set(u) {
              target.cell.setAttribute('fill', u > 0.55 ? ORANGE : SHADE);
              const k = S.spring(u, 0.7, { freq: 2.6, damp: 0.4 });
              S.put(ck.g, { x: -10 + target.cx + 20, y: 6 + target.cy - 18, s: Math.max(0.001, Math.min(1.15, k)), o: u > 0.7 ? 1 : 0 });
              ck.set(ramp(u, 0.85, 0.3, E.out));
            },
          };
        };
        const slack = (p) => {
          const msgs = [
            [-10, -62, 1, ORANGE],
            [10, 0, -1, '#5b7fa6'],
            [-10, 62, 1, '#8aa37b'],
          ].map(([x, y, side, dot]) => ({ c: CAST.chat(p, { w: 220, side, dot, lines: 2 }), x, y }));
          return {
            set(u) {
              msgs.forEach(({ c, x, y }, i) => {
                const a = 0.15 + i * 0.4;
                const k = Math.min(1.1, S.spring(u, a, { freq: 2.8, damp: 0.45 }));
                S.put(c, { x, y: y + 20 * (1 - Math.min(1, k)), s: Math.max(0.001, k), o: u > a ? 1 : 0 });
              });
            },
          };
        };

        const board = BOARD(K, g2, {
          steps: ['Contract signed', 'Workspace and folders created', 'Welcome pack drafted', 'Kickoff call booked', 'Team briefed in Slack'],
          cards: [contract, folders, welcome, kickoff, slack],
          land: 6.3,
          per: 1.95,
          blink: [7.4, 9.9, 13.3],
        });
        headline(1, 'Fig. 2 · With Neurokov', 'Signed, set up,<br /><em>kicked off</em>.', 4.95, 6.05, { dark: false });
        headline(1, 'Fig. 3 · The whole system', 'Every client,<br /><em>every time</em>.', board.last + 1.1, 99, { dark: false });

        // ---------- Act 3 ----------
        K.endCard({
          at: 17.0,
          kicker: 'Workflow automation · Client onboarding',
          big: 'Onboarding,<br /><em>on autopilot</em>.',
          label: 'Works from day one · Or you don’t pay',
          cta: 'Book a free audit →',
          size: 118,
        });
        K.wipes([[4.6, 'With Neurokov →']]);
        K.note('Illustrated story · A typical first build', () => false);
        K.camera(
          [
            [0, [960, 600, 1.08]],
            [4.6, [960, 600, 1.14], E.sine],
            [4.61, board.keys[0][1], E.linear],
            ...board.keys,
            [20, [board.mid, 600, board.wide * 1.03], E.linear],
          ],
          [[board.lands[0], 0.3, 0.6]],
        );
      });
    </script>
  </body>
</html>
