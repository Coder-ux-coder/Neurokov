<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 20s" />
    <meta name="poster" content="16.2" />
    <title>Custom automation agents</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script src="board.js"></script>
    <script>
      // Custom automation agents, as a board game (services.ts: "An inbox agent"). Act 1:
      // the inbox spits out mail until its owner is buried to the waist. Act 2:
      // NK-01 hops through the agent's five steps. Illustrated; no numbers.
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.6],
          [4.6, 17.0],
          [17.0, 20.1],
        ]);
        const { blinkAt, headline } = K;

        // ---------- Act 1: buried in email ----------
        const g1 = K.act(0);
        K.room(g1, { floor: 870, wall: '#e9e2d4', ground: '#ddd5c6' });
        CAST.dots(g1, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });
        S.put(CAST.plant(g1), { x: 330, y: 870, s: 1.1 });

        // the mail app on the wall: its count climbs and it spits the mail out
        const IX = 1540, IY = 390;
        const tile = S.g(g1);
        S.svg('rect', { x: -140 + 12, y: -115 + 14, width: 280, height: 230, rx: 44, fill: INK }, tile);
        S.svg('rect', { x: -140, y: -115, width: 280, height: 230, rx: 44, fill: PAPER, stroke: INK, 'stroke-width': 6 }, tile);
        S.put(CAST.envelope(tile, { w: 170, h: 112 }).g, { y: 4 });
        const unread = CAST.badge(tile, { r: 50 });
        S.put(unread.g, { x: 140, y: -115 });

        // the pile: bottom row first, so it builds up around its owner
        const REST = [];
        [[8, 846], [7, 810], [6, 774], [5, 740], [4, 706], [3, 674]].forEach(([n, y], j) => {
          for (let i = 0; i < n; i++) {
            const x = 900 + (i - (n - 1) / 2) * 72 + ((((i * 7 + j * 13) % 11) - 5) * 3);
            REST.push([x, y + ((i * 5 + j) % 3) * 4, ((i * 37 + j * 11) % 30) - 15]);
          }
        });
        const N = REST.length;
        const launchAt = (i) => 0.35 + 3.75 * Math.pow(i / (N - 1), 0.8);
        const launched = (t) => REST.filter((_, i) => t > launchAt(i)).length;
        S.track((t) => {
          const n = launched(t);
          const count = 3 + 3 * n;
          unread.set(count >= 99 ? '99+' : String(count));
          const last = n ? launchAt(n - 1) : -9;
          S.put(unread.g, { x: 140, y: -115, s: 1 + 0.25 * hit(t, last, 0.2) });
          S.put(tile, { x: IX, y: IY, r: 3 * hit(t, last, 0.25) * (n % 2 ? 1 : -1), s: 1 + 0.03 * hit(t, last, 0.2) });
        });

        // its owner, reading the phone, then looking up, then flailing
        const owner = CAST.person(g1, { shirt: '#5b7fa6', hair: 'curly', hairColor: '#3a2a1e' });
        const phone = CAST.phone(g1, { w: 60, h: 108 });
        // the phone shows the same inbox, filling up
        S.svg('rect', { x: -21, y: -45, width: 42, height: 16, fill: ORANGE }, phone.ui);
        [0, 1, 2, 3].forEach((i) => S.svg('rect', { x: -15, y: -20 + i * 15, width: i % 2 ? 22 : 30, height: 6, rx: 3, fill: INK, opacity: 0.7 }, phone.ui));
        const buzz = S.svg('path', { d: 'M -46 -30 l -12 -6 M -48 0 l -14 0 M -46 30 l -12 6 M 46 -30 l 12 -6 M 48 0 l 14 0 M 46 30 l 12 6', fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, phone.g);
        const sweats = [0, 1, 2].map(() => CAST.sweat(g1));
        const mix = (a, b, k) => a.map((p, i) => p.map((v, j) => v + (b[i][j] - v) * k));
        S.track((t) => {
          const up = ramp(t, 1.15, 0.3);
          const panic = ramp(t, 2.6, 0.35);
          const flail = 14 * Math.sin(t * 16) * panic;
          // (the phone goes up, but never as high as the headline)
          owner.set({
            x: 900, y: 870, lean: -4 * panic, headTilt: -6 * up + 5 * Math.sin(t * 7) * panic,
            arm: mix([[10, -10], [30, 128]], [[165 + flail, 10], [140 - 0.7 * flail, 28]], panic),
            mouth: t < 1.2 ? 'smile' : t < 2.6 ? 'o' : 'frown',
            look: up > 0.5 ? [1, -0.7] : [0.6, 0.7], blink: blinkAt(t, [0.7, 2.2]),
          });
          const [hx, hy] = owner.hand;
          const buzzing = hit(t % 0.8, 0, 0.3) * (1 - panic);
          S.put(phone.g, { x: 900 + hx + 6, y: 870 + hy - 30 + 16 * panic, r: 12 + 8 * Math.sin(t * 60) * buzzing - 30 * panic });
          buzz.style.visibility = buzzing > 0.25 ? '' : 'hidden';
          [2.8, 3.25, 3.7].forEach((a, i) => {
            S.put(sweats[i].g, { x: 900 + (i % 2 ? 44 : -40), y: 870 - 340 });
            sweats[i].set(ramp(t, a, 0.6, E.linear));
          });
        });
        // the mail, arcing out of the app onto the pile (in front of its owner)
        REST.forEach(([rx, ry, rr], i) => {
          const e = CAST.envelope(g1, { w: 84, h: 56, seal: i % 3 ? ORANGE : GRAY });
          const at = launchAt(i);
          S.track((t) => {
            const p = ramp(t, at, 0.55, E.linear);
            const land = hit(t, at + 0.55, 0.2);
            S.put(e.g, {
              x: IX - 120 + (rx - IX + 120) * p,
              y: IY + (ry - IY) * p - 170 * Math.sin(Math.PI * p),
              r: rr * p + 400 * (1 - p),
              // (each grows out of the app as it leaves)
              sx: (0.7 + 0.3 * p) * (1 + 0.15 * land) * K.pop(t, at),
              sy: (0.7 + 0.3 * p) * (1 - 0.2 * land) * K.pop(t, at),
              o: t > at ? 1 : 0,
            });
          });
        });
        headline(0, 'Fig. 1 · Sound familiar?', 'Your morning,<br />lost to the <em>inbox</em>.', 0.35, 4.25, { dark: false });

        // ---------- Act 2: the inbox agent, square by square ----------
        const g2 = K.act(1);
        S.svg('rect', { x: -1400, y: -900, width: 6400, height: 2800, fill: PAPER }, g2);
        CAST.dots(g2, { x0: -1400, y0: -900, w: 6400, h: 1770, o: 0.1 });
        CAST.ground(g2, { x0: -1400, x1: 5000 }).setAttribute('transform', 'translate(0 870)');

        const arrives = (p) => {
          const e = CAST.envelope(p, { w: 150, h: 100 });
          const bell = CAST.bell(p, { r: 30 });
          S.put(bell.g, { x: 100, y: -52 });
          const ring = S.svg('path', { d: 'M 62 -102 l -12 -12 M 138 -102 l 12 -12 M 146 -60 l 14 0', fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, p);
          return {
            set(u) {
              const k = Math.min(1.12, S.spring(u, 0.1, { freq: 2.6, damp: 0.42 }));
              S.put(e.g, { x: -40, y: 22 - 40 * (1 - Math.min(1, k)), s: Math.max(0.001, k), r: -4, o: u > 0.1 ? 1 : 0 });
              const ringing = env(u, 0.35, 1.25, 0.05, 0.3);
              S.put(bell.body, { r: 16 * Math.sin(u * 26) * ringing });
              ring.style.visibility = ringing > 0.3 && Math.sin(u * 26) > -0.4 ? '' : 'hidden';
            },
          };
        };
        const classify = (p) => {
          const d = CAST.doc(p, { w: 130, h: 170, lines: 5 });
          S.put(d.g, { x: -72, y: 4, r: -3 });
          const scan = S.svg('rect', { x: -146, y: -3, width: 148, height: 6, rx: 3, fill: ORANGE, stroke: INK, 'stroke-width': 2 }, p);
          const TAGS = ['LEAD', 'SUPPORT', 'SPAM'].map((text, i) => ({ g: CAST.tag(p, { text, size: 16 }), y: -54 + i * 52 }));
          const lead = CAST.tag(p, { text: 'LEAD', size: 16, fill: ORANGE });
          const sp = CAST.sparkle(p, { r: 16 });
          return {
            set(u) {
              const q = ramp(u, 0.1, 0.7, E.inOut);
              S.put(scan, { y: -76 + 156 * q, o: u > 0.1 && u < 0.85 ? 1 : 0 });
              TAGS.forEach(({ g, y }, i) => S.put(g, { x: 78, y, o: i && u > 0.85 ? 0.35 : 1 }));
              const k = Math.min(1.15, S.spring(u, 0.85, { freq: 2.8, damp: 0.4 }));
              S.put(lead, { x: 78, y: -54, s: Math.max(0.001, k), o: u > 0.85 ? 1 : 0 });
              S.put(sp, { x: 136, y: -86, s: Math.max(0.001, Math.min(1, (u - 0.9) * 4)), r: 20 * u, o: u > 0.9 ? 1 : 0 });
            },
          };
        };
        const draft = (p) => {
          const d = CAST.doc(p, { w: 170, h: 200, lines: 6 });
          S.put(d.g, { x: -34, y: 4, r: 2 });
          const pill = S.g(p);
          S.svg('rect', { x: -52, y: -26, width: 104, height: 52, rx: 26, fill: PAPER, stroke: INK, 'stroke-width': 4 }, pill);
          const wv = CAST.wave(pill, { n: 7, w: 78, h: 34 });
          const sp = CAST.sparkle(p, { r: 15 });
          return {
            set(u) {
              d.set(ramp(u, 0.2, 1.2, E.linear));
              wv.set(u, u < 1.4 ? 1 : 0.45);
              const k = Math.min(1.1, S.spring(u, 0.05, { freq: 2.6, damp: 0.45 }));
              S.put(pill, { x: 98, y: -78, s: Math.max(0.001, k), o: u > 0.05 ? 1 : 0 });
              S.put(sp, { x: 104, y: 70, s: Math.max(0.001, Math.min(1, (u - 0.3) * 3)) * (1 + 0.12 * Math.sin(u * 8)), r: 15 * Math.sin(u * 3), o: u > 0.3 ? 1 : 0 });
            },
          };
        };
        const approve = (p) => {
          S.put(CAST.chat(p, { w: 236, side: 1, dot: ORANGE, lines: 2 }), { x: -4, y: -66 });
          S.svg('rect', { x: -96 + 7, y: 26 - 24 + 9, width: 192, height: 56, rx: 12, fill: INK }, p);
          const btn = S.g(p);
          const face = S.svg('rect', { x: -96, y: -24, width: 192, height: 56, rx: 12, fill: PAPER, stroke: INK, 'stroke-width': 4 }, btn);
          const label = S.svg('text', { x: 0, y: 12, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 22, 'letter-spacing': 2, fill: INK }, btn);
          label.textContent = 'APPROVE';
          const ck = CAST.check(p, { r: 20 });
          const cursor = S.svg('path', { d: 'M 0 0 L 0 38 L 10 29 L 17 45 L 25 42 L 18 27 L 30 27 Z', fill: PAPER, stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, p);
          return {
            set(u) {
              const q = ramp(u, 0.1, 0.45, E.inOut);
              const press = hit(u, 0.6, 0.3);
              S.put(btn, { x: 7 * press, y: 26 + 9 * press });
              face.setAttribute('fill', u > 0.62 ? ORANGE : PAPER);
              S.put(cursor, { x: 120 - 100 * q, y: 104 - 60 * q, s: (1 - 0.12 * press) * K.pop(u, 0.05, 1.5), o: u > 0.05 && u < 1.5 ? 1 : 0 });
              const k = Math.min(1.15, S.spring(u, 0.75, { freq: 2.6, damp: 0.4 }));
              S.put(ck.g, { x: 100, y: 2, s: Math.max(0.001, k), o: u > 0.75 ? 1 : 0 });
              ck.set(ramp(u, 0.85, 0.3, E.out));
            },
          };
        };
        const logged = (p) => {
          const tb = S.g(p);
          S.put(tb, { x: -14, y: 30 });
          S.svg('rect', { x: -119, y: -62, width: 250, height: 146, rx: 12, fill: INK }, tb);
          S.svg('rect', { x: -125, y: -70, width: 250, height: 146, rx: 12, fill: PAPER, stroke: INK, 'stroke-width': 4 }, tb);
          S.svg('path', { d: 'M -125 -38 L 125 -38', stroke: INK, 'stroke-width': 4 }, tb);
          const head = S.svg('text', { x: -106, y: -47, 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 17, 'letter-spacing': 2, fill: INK }, tb);
          head.textContent = 'CRM';
          const mk = (fill) => {
            const r = S.g(tb);
            S.svg('rect', { x: -113, y: -13, width: 226, height: 26, rx: 6, fill, stroke: INK, 'stroke-width': 2.5 }, r);
            S.svg('rect', { x: -101, y: -4, width: 96, height: 8, rx: 4, fill: INK, opacity: 0.8 }, r);
            S.svg('rect', { x: 14, y: -4, width: 50, height: 8, rx: 4, fill: INK, opacity: 0.4 }, r);
            return r;
          };
          const olds = [mk(SHADE), mk(SHADE)];
          const fresh = mk('#ffe2cf');
          const ck = CAST.check(tb, { r: 15 });
          const plane = CAST.plane(p);
          return {
            set(u) {
              const q = ramp(u, 0.1, 0.6, E.in);
              S.put(plane, { x: -60 + 200 * q, y: -70 - 40 * q, r: -24, s: 0.55 * K.pop(u, 0.1, 0.7), o: u > 0.1 && q < 1 ? 1 : 0 });
              const k = ramp(u, 0.55, 0.35, E.out);
              olds.forEach((r, i) => S.put(r, { y: -16 + 32 * (i + k) }));
              S.put(fresh, { y: -16, sy: Math.max(0.001, k), o: k > 0 ? 1 : 0 });
              const c = Math.min(1.15, S.spring(u, 0.9, { freq: 2.6, damp: 0.4 }));
              S.put(ck.g, { x: 94, y: -16, s: Math.max(0.001, c), o: u > 0.9 ? 1 : 0 });
              ck.set(ramp(u, 1.0, 0.3, E.out));
            },
          };
        };

        const board = BOARD(K, g2, {
          steps: ['New email arrives', 'Read and classified', 'Drafts a reply in your voice', 'You approve in one click', 'Sent and logged in your CRM'],
          cards: [arrives, classify, draft, approve, logged],
          land: 6.3,
          per: 1.95,
          blink: [7.4, 9.9, 13.3],
        });
        headline(1, 'Fig. 2 · With Neurokov', 'An agent that works<br /><em>your inbox</em>.', 4.95, 6.05, { dark: false });
        headline(1, 'Fig. 3 · The whole agent', 'You approve.<br /><em>It does the rest</em>.', board.last + 1.1, 99, { dark: false });

        // ---------- Act 3 ----------
        K.endCard({
          at: 17.0,
          kicker: 'Custom automation agents · An inbox agent',
          big: 'Your inbox,<br /><em>handled</em>.',
          label: 'You approve the replies that matter · In one click',
          cta: 'Book a free audit →',
          size: 118,
        });
        K.wipes([[4.6, 'With Neurokov →']]);
        K.note('Illustrated story · A typical inbox agent', () => false);
        K.camera(
          [
            [0, [960, 600, 1.08]],
            [4.6, [960, 600, 1.14], E.sine],
            [4.61, board.keys[0][1], E.linear],
            ...board.keys,
            [20, [board.mid, 600, board.wide * 1.03], E.linear],
          ],
          [[board.lands[0], 0.3, 0.6]],
        );
      });
    </script>
  </body>
</html>
