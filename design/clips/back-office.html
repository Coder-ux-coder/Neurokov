<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="clip" content="1920x1080 20s" />
    <meta name="poster" content="11.5" />
    <title>Back-office autopilot</title>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
      <div id="hud"><div id="hud-cam"></div></div>
    </div>
    <script src="engine.js"></script>
    <script src="cast.js"></script>
    <script src="story.js"></script>
    <script>
      // Case 04, told as a story: the ops team had become the bottleneck, and a
      // new client waited 14 days to be onboarded. With the system, one form
      // sets up everything (3 days), tickets are triaged on arrival, and invoices go
      // out on time (71% to 98%): 62 hours of admin gone every week. Real
      // numbers only (case 04).
      STAGE.setup((S) => {
        const { INK, PAPER, ORANGE, GRAY, SHADE } = CAST;
        const { E, ramp, env, hit } = S;
        const K = STORY([
          [0, 4.4],
          [4.4, 8.4],
          [8.4, 15.6],
          [15.6, 20.1],
        ]);
        const { blinkAt, headline } = K;
        const BLUE = '#5b7fa6', GREEN = '#8aa37b', PLUM = '#9b6b8e', BROWN = '#6b4a2e';
        const TAGS = [ORANGE, BLUE, GREEN];

        // A work item: a small card with a coloured tag and a word on it.
        const item = (parent, label, tag = GRAY, w = 96, h = 62) => {
          const g = S.g(parent);
          S.svg('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 9, fill: PAPER, stroke: INK, 'stroke-width': 4 }, g);
          const t = S.svg('rect', { x: -w / 2 + 10, y: -h / 2 + 10, width: 30, height: 12, rx: 6, fill: tag, stroke: INK, 'stroke-width': 2.5 }, g);
          const tx = S.svg('text', { x: -w / 2 + 10, y: h / 2 - 12, 'font-family': 'IBM Plex Mono', 'font-weight': 600, 'font-size': 13, 'letter-spacing': 1, fill: INK }, g);
          tx.textContent = label;
          return { g, tag: t };
        };
        const KINDS = ['TICKET', 'FORM', 'INVOICE', 'REPORT'];

        // ---------- Act 1: the bottleneck ----------
        const g1 = K.act(0);
        K.room(g1, { floor: 870, wall: '#ebe5d9', ground: '#ddd5c6' });
        CAST.dots(g1, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });
        const clock1 = CAST.clock(g1, { r: 56 });
        S.put(clock1.g, { x: 1600, y: 330 });
        S.track((t) => clock1.set(10 + t * 1.3));
        const BODY = 'M 560 540 L 1060 540 C 1115 540 1130 640 1180 640 L 1320 640 L 1320 730 L 1180 730 C 1130 730 1115 830 1060 830 L 560 830 Q 500 830 500 770 L 500 600 Q 500 540 560 540 Z';
        for (const x of [620, 980]) S.svg('path', { d: `M ${x - 50} 870 L ${x - 34} 826 L ${x + 34} 826 L ${x + 50} 870 Z`, fill: '#a86f4b', stroke: INK, 'stroke-width': 5, 'stroke-linejoin': 'round' }, g1);
        S.svg('path', { d: BODY, fill: '#dff1ff', opacity: 0.55 }, g1);
        const inside = S.g(g1);
        const packed = [];
        // (the bottom row drawn first, so each row lies over the tops of the cards
        // below it and never over their labels, which run along the bottom)
        for (let r = 3; r >= 0; r--)
          for (let c = 0; c < 5; c++) {
            const k = r * 5 + c;
            const it = item(inside, KINDS[(k * 3) % 4], [ORANGE, GRAY, BLUE][k % 3]);
            packed.push({ it, x: 575 + c * 104 + ((k * 17) % 13) - 6, y: 588 + r * 64 + ((k * 29) % 11) - 5, r0: ((k * 37) % 30) - 15, k });
          }
        packed.push({ it: item(inside, 'FORM', GRAY), x: 1100, y: 650, r0: 12, k: 20 });
        packed.push({ it: item(inside, 'TICKET', ORANGE), x: 1105, y: 722, r0: -10, k: 21 });
        S.track((t) =>
          packed.forEach(({ it, x, y, r0, k }) =>
            S.put(it.g, { x: x + 3 * S.noise(k, t * 3), y: y + 3 * S.noise(k + 40, t * 3), r: r0 + 4 * S.noise(k + 80, t * 2) }),
          ),
        );
        S.svg('path', { d: BODY, fill: 'none', stroke: INK, 'stroke-width': 7, 'stroke-linejoin': 'round' }, g1);
        S.svg('rect', { x: 1316, y: 626, width: 26, height: 118, rx: 6, fill: '#dff1ff', stroke: INK, 'stroke-width': 6 }, g1);
        S.svg('path', { d: 'M 560 566 L 1030 566', stroke: PAPER, 'stroke-width': 8, 'stroke-linecap': 'round', opacity: 0.9 }, g1);
        const tbl1 = CAST.table(g1, { w: 200, h: 150 });
        S.put(tbl1, { x: 1680, y: 870 });
        // three items squeeze out, slowly, one at a time, and land on the table
        // stepped far enough apart that each one's label shows whole
        const out1 = [0, 1, 2].map((i) => {
          const it = item(g1, KINDS[i], [ORANGE, BLUE, GRAY][i]);
          const at = 0.5 + i * 1.25;
          S.track((t) => {
            const sq = ramp(t, at, 0.75, E.inOut);
            const toss = ramp(t, at + 0.95, 0.45, E.inOut);
            let x = 1110 + (1352 - 1110) * sq, y = 685, sy = 1 - 0.45 * Math.sin(Math.PI * Math.min(1, sq * 1.4)), r = 0;
            if (toss > 0) {
              x = 1352 + (1680 - 1352) * toss;
              y = 685 + (706 - i * 36 - 685) * toss - 200 * Math.sin(Math.PI * toss);
              sy = 1;
              r = 360 * toss + (i % 2 ? -8 : 6) * toss;
            }
            // (it fades up out of the jam as it starts to squeeze through)
            S.put(it.g, { x, y, sx: 1, sy, r, o: ramp(t, at, 0.15, E.linear) });
          });
          return at;
        });
        const pop = CAST.burst(g1, { color: ORANGE, r0: 40, r1: 80, n: 7 });
        S.put(pop.g, { x: 1352, y: 685 });
        const ops = CAST.person(g1, { shirt: BLUE, hair: 'bun', hairColor: '#3a2a1e' });
        const drops = [0, 1].map(() => CAST.sweat(g1));
        S.track((t) => {
          const last = out1.filter((a) => t > a + 0.9).pop();
          pop.set(last ? ramp(t, last + 0.9, 0.3, E.linear) : 0);
          const tug = Math.sin(t * 9);
          ops.set({
            x: 1470, y: 870, flip: -1, lean: -10 + 4 * tug, arm: [[78, 26 + 6 * tug], [86, 16 - 6 * tug]], leg: [[-10, 0], [16, 0]],
            mouth: out1.some((a) => t > a + 0.9 && t < a + 1.3) ? 'grin' : 'o', look: [1, 0.2], blink: blinkAt(t, [1.9, 3.7]),
          });
          drops.forEach((d, i) => {
            S.put(d.g, { x: 1440, y: 510 });
            d.set(ramp(t, 1.2 + i * 1.5, 0.6, E.linear));
          });
        });
        headline(0, 'Fig. 1 · IT services company, 30 people', 'Ops had become<br />the <em>bottleneck</em>.', 0.45, 4.0, { dark: false });

        // ---------- Act 2: 14 days to onboard ----------
        const g2 = K.act(1);
        K.room(g2, { floor: 870, wall: '#e9e2d4', ground: '#ddd5c6' });
        CAST.dots(g2, { x0: -600, y0: -600, w: 3200, h: 1470, o: 0.08 });
        const pad = CAST.pad(g2, { w: 250, h: 300 });
        S.put(pad.g, { x: 1300, y: 450 });
        S.put(CAST.plant(g2), { x: 470, y: 870, s: 1.1 });
        const chair2 = CAST.chair(g2);
        S.put(chair2, { x: 700, y: 870 });
        const client = CAST.person(g2, { shirt: PLUM, hair: 'short', hairColor: BROWN });
        const beard = S.svg('path', { d: 'M -38 20 Q -46 70 -18 102 Q 0 126 18 102 Q 46 70 38 20 Q 20 36 0 36 Q -20 36 -38 20 Z', fill: BROWN, stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, client.head);
        const web2 = S.svg('path', { d: 'M 0 0 L 60 50 M 0 0 L 0 70 M 0 0 L 76 4 M 0 26 Q 22 24 30 2 M 0 48 Q 40 44 52 4', fill: 'none', stroke: INK, 'stroke-width': 2.5 }, g2);
        S.put(web2, { x: 642, y: 622 });
        const mail = Array.from({ length: 7 }, (_, i) => {
          const e = CAST.envelope(g2, { w: 84, h: 56, seal: i % 2 ? GRAY : ORANGE });
          const at = 4.85 + i * 0.47;
          S.track((t) => {
            const p = ramp(t, at, 0.5, E.inOut);
            const q = i % 2 ? 1 - p : p; // out to the team, then back
            // (gone as the next one sets off: kept to the end, two sat on each other for a frame)
            S.put(e.g, { x: 860 + (1990 - 860) * q, y: 610 + 70 * Math.sin(Math.PI * q), r: (i % 2 ? -1 : 1) * 12, s: 0.9, o: t > at && t < at + 0.47 ? 1 : 0 });
          });
          return e;
        });
        const DAYS = 14;
        const dayAt = (t) => 1 + Math.floor((DAYS - 1) * ramp(t, 4.9, 3.1, E.linear));
        S.track((t) => {
          const d = dayAt(t);
          pad.setDay(String(d).padStart(2, '0'));
          // the page that was just torn off
          const te = 4.9 + ((d - 1) * 3.1) / (DAYS - 1);
          const fly = d > 1 ? ramp(t, te, 0.22, E.linear) : 1;
          pad.flyText(String(d - 1).padStart(2, '0'));
          // (solid while it covers the new day, like paper, and faded only as it
          // clears it: see-through, the two days showed one through the other)
          S.put(pad.flyer, { x: 150 * fly, y: 260 * fly * fly, r: 55 * fly, o: fly < 1 ? 1 - ramp(fly, 0.55, 0.45, E.linear) : 0 });
          const k = (d - 1) / (DAYS - 1);
          beard.setAttribute('transform', `translate(0 20) scale(1 ${Math.max(0.001, k * 1.8).toFixed(3)}) translate(0 -20)`);
          beard.style.visibility = k > 0.02 ? '' : 'hidden';
          client.set({
            x: 750, y: 870, seated: 120, leg: [[70, -70], [76, -74 + 8 * Math.sin(t * 14) * (d < 10 ? 1 : 0)]],
            arm: [[30, 50], [44 + 4 * Math.sin(t * 20), 60]], lean: d > 12 ? 10 : 0, headTilt: d > 12 ? 10 : 0,
            mouth: d < 5 ? 'smile' : d < 10 ? 'flat' : 'frown', look: [0.8, -0.7], blink: blinkAt(t, [5.3, 6.4, 7.6]),
          });
          S.put(web2, { x: 642, y: 622, s: Math.max(0.001, ramp(t, 6.6, 0.8, E.out)), o: t > 6.6 ? 1 : 0 });
        });
        headline(1, 'Fig. 2 · The old way', 'Onboarding took<br /><em>14 days</em>.', 4.85, 8.0, { dark: false });

        // ---------- Act 3: with Neurokov ----------
        const g3 = K.act(2);
        S.svg('rect', { x: -600, y: -600, width: 5200, height: 2400, fill: PAPER }, g3);
        CAST.dots(g3, { x0: -600, y0: -600, w: 5200, h: 2400 });
        CAST.ground(g3, { x0: -600, x1: 4600 }).setAttribute('transform', 'translate(0 870)');
        const chip3 = K.hudAct(S.html('<div class="chip" style="left:1500px;top:170px"></div>'), 2);
        // [when, label, where on screen]: the first sits high enough to clear NK-01's
        // antenna, the second below the chute, clear of the tickets sliding down it
        const CHIPS = [
          [8.95, '01 · Onboarding from one form', 1500, 150],
          [12.55, '02 · Every ticket triaged', 1640, 450],
        ];
        S.track((t) => {
          const cur = CHIPS.filter(([at]) => t >= at).pop();
          if (!cur) return (chip3.style.opacity = 0);
          const next = CHIPS.find(([at]) => at > t);
          const p = Math.min(1.15, S.spring(t, cur[0], { freq: 2.4, damp: 0.45 }));
          const out = next ? ramp(t, next[0] - 0.55, 0.2, E.in) : 0;
          chip3.textContent = cur[1];
          S.style(chip3, { left: `${cur[2]}px`, top: `${cur[3]}px` });
          chip3.style.opacity = 1;
          chip3.style.transform = `translate(-50%, -50%) scale(${Math.max(0.001, p * (1 - out)).toFixed(3)}) rotate(-2deg)`;
        });
        // beat A: one form, then everything else happens
        const client3 = CAST.person(g3, { shirt: PLUM, hair: 'short', hairColor: BROWN });
        const form = CAST.clipboard(g3, { w: 280, h: 360, fields: 4 });
        S.put(form.g, { x: 650, y: 690, r: -3 });
        const pen = S.svg('path', { d: 'M 0 0 L 10 -46 L 20 -44 L 12 2 Z', fill: ORANGE, stroke: INK, 'stroke-width': 3.5, 'stroke-linejoin': 'round' }, g3);
        const press = CAST.burst(g3, { color: ORANGE, r0: 60, r1: 100, n: 8 });
        S.put(press.g, { x: 650, y: 814 });
        const RESULTS = [
          ['Accounts created', 1200, 590],
          ['Documents collected', 1580, 590],
          ['Kickoff call booked', 1200, 750],
          ['Team notified', 1580, 750],
        ];
        // Dotted wires that march, drawn out from the form. The drawing out is a mask
        // (a solid copy drawn along the wire): the dots move by their dash offset, and
        // S.draw works by the dash offset too, so on the wire itself the dots undid
        // the drawing and each wire showed as a loose stretch from its far end.
        const defs = S.svg('defs', {}, g3);
        const wires = RESULTS.map(([, x, y], i) => {
          const d = `M 720 800 C 900 800 ${x - 260} ${y} ${x - 170} ${y}`;
          const mask = S.svg('mask', { id: `bo-wire-${i}`, maskUnits: 'userSpaceOnUse', x: -600, y: -600, width: 5200, height: 2400 }, defs);
          const reveal = S.svg('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 14, 'stroke-linecap': 'round' }, mask);
          const w = S.svg('path', { d, fill: 'none', stroke: ORANGE, 'stroke-width': 5, 'stroke-dasharray': '3 14', 'stroke-linecap': 'round', mask: `url(#bo-wire-${i})` }, g3);
          return { w, reveal };
        });
        const cards = RESULTS.map(([label, x, y], i) => {
          const g = S.g(g3);
          S.svg('rect', { x: -164, y: -52, width: 340, height: 112, rx: 18, fill: INK }, g);
          S.svg('rect', { x: -170, y: -60, width: 340, height: 112, rx: 18, fill: PAPER, stroke: INK, 'stroke-width': 5 }, g);
          const tx = S.svg('text', { x: -138, y: 12, 'font-family': 'Archivo Variable', 'font-weight': 650, 'font-size': 30, fill: INK }, g);
          tx.textContent = label;
          const ck = CAST.check(g, { r: 22 });
          S.put(ck.g, { x: 134, y: -60 });
          return { g, ck, x, y, at: 10.15 + i * 0.32 };
        });
        const bot3 = CAST.robot(g3);
        // beat B: tickets, sorted to the right technician with a suggested fix
        const LANES = ['Network', 'Accounts', 'Hardware'];
        const techs = LANES.map((name, i) => {
          const x = 2330 + i * 300;
          const d = CAST.desk(g3, { w: 220, h: 150 });
          S.put(d, { x: x + 40, y: 870 });
          const p = CAST.person(g3, { shirt: [BLUE, GREEN, '#e0b44c'][i], hair: ['short', 'curly', 'bob'][i], hairColor: [INK, BROWN, '#3a2a1e'][i] });
          // (each lane's name on the floor in front of its desk, clear of the tickets' arcs)
          const tag = K.hudAct(S.html(`<div class="mono" style="left:${x + 20}px;top:895px;transform:translateX(-50%);padding:6px 12px;border:3px solid #121212;background:${TAGS[i]};color:#121212;font-size:20px;font-weight:600">${name}</div>`, S.hudCam), 2);
          return { x, p, tag };
        });
        const chute = S.g(g3);
        S.svg('path', { d: 'M 3640 -120 L 3820 -80 L 3560 430 L 3390 400 Z', fill: GRAY, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, chute);
        S.svg('path', { d: 'M 3690 -110 L 3440 408', stroke: INK, 'stroke-width': 3, opacity: 0.3 }, chute);
        const LANE_OF = [0, 2, 1, 0, 1, 2];
        const tickets = LANE_OF.map((lane, i) => {
          const it = item(g3, 'TICKET', GRAY, 104, 66);
          const note = S.svg('rect', { x: 18, y: -48, width: 40, height: 34, fill: '#ffd166', stroke: INK, 'stroke-width': 3, transform: 'rotate(8)' }, it.g);
          const at = 12.7 + i * 0.42;
          // (held only briefly: each is well on its way before the next one lands)
          S.track((t) => {
            const slide = ramp(t, at, 0.3, E.in);
            const held = t > at + 0.3 && t < at + 0.5;
            const toss = ramp(t, at + 0.5, 0.4, E.inOut);
            // a lane's second ticket lands a little left of its first, square over its
            // label, so no half-hidden label peeks out from under it
            const tx = techs[lane].x + 40 - 8 * ((i / 3) | 0), ty = 870 - 150 - 36;
            let x, y, r;
            if (toss > 0) {
              x = 3230 + (tx - 3230) * toss;
              // a low arc, under the headline
              y = 470 + (ty - 470) * toss - 90 * Math.sin(Math.PI * toss);
              r = -360 * toss;
            } else if (held) {
              x = 3230;
              y = 470;
              r = -6;
            } else {
              x = 3730 + (3230 - 3730) * slide;
              y = -150 + (470 + 150) * slide;
              r = 16 - 22 * slide;
            }
            S.put(it.g, { x, y, r, o: t > at ? 1 : 0 });
            it.tag.setAttribute('fill', t > at + 0.36 ? TAGS[lane] : GRAY);
            // (the suggested fix springs on, about its own middle)
            const nk = Math.max(0.001, Math.min(1.1, S.spring(t, at + 0.42, { freq: 2.8, damp: 0.5 })));
            note.setAttribute('transform', `translate(38 -31) scale(${nk.toFixed(4)}) translate(-38 31) rotate(8)`);
            note.style.visibility = t > at + 0.42 ? '' : 'hidden';
          });
          return { lane, at };
        });
        const scan3 = S.svg('path', { fill: ORANGE, opacity: 0.25 }, g3);
        S.track((t) => {
          // the client ticks the form and sends it
          const tickAt = (i) => 8.8 + i * 0.22;
          form.ticks.forEach((tk, i) => S.draw(tk, ramp(t, tickAt(i), 0.16, E.out)));
          const writing = t < 9.55;
          const pressing = env(t, 9.6, 9.95, 0.12);
          const row = S.clamp(Math.floor((t - 8.8) / 0.22), 0, 3);
          const armW = writing ? [[20, 40], [58 + row * 6, 58 - row * 4 + 6 * Math.sin(t * 40)]] : [[20, 40], [70 * (1 - pressing) + 96 * pressing, 40 * (1 - pressing) + 12 * pressing]];
          client3.set({
            x: 420, y: 870, arm: armW, mouth: t > 10.2 ? 'grin' : 'smile', look: t > 10.1 ? [1, -0.3] : [1, 0.6],
            blink: blinkAt(t, [9.2, 11.6]), leg: [[4, 0], [-4, 0]],
          });
          const [hx, hy] = client3.hand;
          S.put(pen, { x: 420 + hx, y: 870 + hy + 6, r: 14, s: K.pop(t, 8.6, 9.55), o: t > 8.6 && writing ? 1 : 0 });
          S.put(form.button, { x: 0, y: 0, sy: 1 - 0.15 * pressing, sx: 1 });
          press.set(ramp(t, 9.8, 0.35, E.linear));
          wires.forEach(({ w, reveal }, i) => {
            S.draw(reveal, ramp(t, 9.85 + i * 0.32, 0.35, E.out));
            w.setAttribute('stroke-dashoffset', (-t * 30).toFixed(1));
            w.style.visibility = reveal.style.visibility;
          });
          cards.forEach(({ g, ck, x, y, at }) => {
            const p = Math.min(1.12, S.spring(t, at, { freq: 2.5, damp: 0.45 }));
            S.put(g, { x, y, s: Math.max(0.001, p), o: t > at ? 1 : 0 });
            ck.set(ramp(t, at + 0.25, 0.25, E.out));
          });
          // NK-01: in to the form (low, under the beat's label), over the cards,
          // then across to the tickets
          const [bx, by] = S.kf(t, [
            [9.35, [2100, 460]],
            [9.9, [1390, 440], E.out],
            [12.2, [1390, 440]],
            [12.75, [3230, 560], E.inOut],
          ]);
          const flying = env(t, 9.35, 9.9, 0.1) + env(t, 12.2, 12.75, 0.1);
          const bob = 8 * Math.sin(t * 2.6);
          // On the way across it tucks its hands in, the back one raised behind it and
          // the front one folded (hanging, they would dip onto the cards under it), and
          // lets the front one down just before it lands (still folded, it would reach
          // under the beat's label); and it rises a little over the team's heads (level,
          // its name would pass behind them): any higher and it would fly into the headline.
          const across = [env(t, 12.2, 12.75, 0.1), env(t, 12.2, 12.6, 0.1)];
          const lift = 55 * Math.sin(Math.PI * S.clamp((t - 12.47) / 0.28));
          const sorting = t > 12.7;
          const grab = sorting ? tickets.reduce((m, tk) => Math.max(m, env(t, tk.at + 0.28, tk.at + 0.5, 0.06)), 0) : 0;
          // (held from the first card to the last: one per card, it dipped for a frame between two)
          const zap = !sorting && t > 10 ? env(t, cards[0].at - 0.1, cards[cards.length - 1].at + 0.2, 0.08) : 0;
          bot3.set({
            x: bx, y: by + bob - lift, t, ground: 870 - by - bob + lift, flame: 0.35 + 0.65 * flying, tilt: -14 * flying,
            glow: 0.6 + 0.4 * Math.max(grab, zap), eyes: t > 11.3 && t < 12.2 ? 'happy' : 'normal',
            // (it reaches up beside each ticket with its back arm: the front one would
            // cross its name on the way, or the beat's label beside it)
            look: sorting ? [0.7, -0.3 + 0.6 * grab] : [0.2, 0.8],
            arm: (sorting ? [[30 - 195 * grab, -30 + 5 * grab], [-30, 40]] : [[20, -20], [-30 + 60 * zap, 40]]).map((a, j) => a.map((v, k) => v + ([[-110, -10], [-10, 100]][j][k] - v) * across[j])),
            blink: blinkAt(t, [10.9, 13.9]), s: 1.05,
          });
          if (sorting && grab > 0.3) {
            scan3.setAttribute('d', `M ${bx - 40} ${by} L 3190 ${440 + 30 * Math.sin(t * 30)} L 3270 ${500 + 30 * Math.sin(t * 30)} Z`);
            scan3.style.visibility = '';
          } else scan3.style.visibility = 'hidden';
          techs.forEach(({ x, p }, i) => {
            const got = tickets.some((tk) => tk.lane === i && t > tk.at + 0.9 && t < tk.at + 1.53);
            p.set({ x, y: 870, s: 0.8, seated: 120, leg: [[70, -70], [76, -74]], arm: [[30, 50], got ? [150, 20] : [56, 50]], mouth: got ? 'grin' : 'smile', look: [0.6, -0.4], blink: blinkAt(t, [13.1 + i * 0.4]) });
          });
        });
        K.stamp('Onboarded in 3 days', { x: 1390, y: 900, at: 11.45, until: 12.4, rot: -6, size: 36 });
        headline(2, 'Fig. 3 · With Neurokov', 'Now the back office<br /><em>runs itself</em>.', 8.9, 15.3, { dark: false });

        // ---------- Act 4: the first of the month ----------
        const g4 = K.act(3);
        S.svg('rect', { x: -600, y: -600, width: 3200, height: 2400, fill: PAPER }, g4);
        K.paper(g4);
        const pad4 = CAST.pad(g4, { w: 260, h: 300, label: 'MONTH' });
        S.put(pad4.g, { x: 560, y: 660 });
        pad4.setDay('1');
        pad4.flyer.style.visibility = 'hidden';
        const gauge = CAST.gauge(g4, { r: 230, from: 0.71 });
        S.put(gauge.g, { x: 1270, y: 760 });
        const pct = K.hudAct(S.html('<div style="position:absolute;left:1270px;top:640px;transform:translate(-50%,-50%);font-weight:800;font-stretch:125%;font-size:72px;letter-spacing:-0.03em"></div>', S.hudCam), 3);
        const pctLab = K.hudAct(S.html('<div class="mono" style="left:1270px;top:790px;transform:translateX(-50%);font-size:22px">Invoices out on time</div>', S.hudCam), 3);
        const planes4 = [0, 1, 2, 3, 4, 5].map((i) => {
          const pl = CAST.plane(g4, { fill: i % 2 ? PAPER : ORANGE });
          const at = 16.2 + i * 0.22;
          S.track((t) => {
            const p = ramp(t, at, 0.8, E.in);
            S.put(pl, { x: 640 + 1300 * p, y: 600 - 520 * p + 80 * Math.sin(Math.PI * p) + (i % 3) * 30, r: -24, s: 0.7 * K.pop(t, at), o: t > at && p < 1 ? 1 : 0 });
          });
          return pl;
        });
        const bot4 = CAST.robot(g4);
        S.track((t) => {
          const v = 0.71 + 0.27 * S.clamp(S.spring(t, 16.1, { freq: 1.4, damp: 0.5 }), 0, 1.04);
          gauge.set(v, Math.min(v, 0.98));
          pct.textContent = `${Math.round(v * 100 > 98 ? 98 : v * 100)}%`;
          pct.style.color = v > 0.9 ? '#ff4f00' : '#121212';
          bot4.set({ x: 1640, y: 520 + 8 * Math.sin(t * 2.6), t, s: 1, ground: 330, eyes: t > 16.9 ? 'happy' : 'normal', look: [-0.8, 0.4], arm: [[20, -20], t > 16.9 ? [-150 + 24 * Math.sin(t * 12), -30] : [-30, 30]], flame: 0.4, glow: 0.8 });
        });
        headline(3, 'Fig. 4 · The first of the month', 'Invoices out<br /><em>on time</em>.', 15.95, 99, { dark: false });

        // ---------- The close ----------
        K.endCard({
          at: 18.3,
          kicker: 'Case 04 · Back-office autopilot · IT services company, 30 people',
          big: '<b data-n>0</b> hrs of admin, <em>gone</em>',
          count: [0, 62],
          label: 'Every week · Onboarding 14 → 3 days · Invoices on time 71% → 98%',
          size: 116,
        });
        K.wipes([
          [4.4, 'A new client signs →'],
          [8.4, '◀◀ Rewind · With Neurokov'],
          [15.6, 'On the first of the month →'],
        ]);
        K.note('Illustrated story · Real numbers from case 04', () => false);
        K.camera([
          [0, [960, 640, 1.12]],
          [4.4, [960, 640, 1.18], E.sine],
          [4.41, [980, 640, 1.15], E.linear],
          [8.4, [980, 640, 1.2], E.sine],
          [8.41, [960, 620, 1.05], E.linear],
          [12.2, [980, 620, 1.05], E.linear],
          [12.7, [2950, 620, 1.05], E.inOut],
          [15.6, [2970, 620, 1.08], E.linear],
          [15.61, [960, 640, 1.12], E.linear],
          [20, [960, 640, 1.17], E.sine],
        ]);
      });
